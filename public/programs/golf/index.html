<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="/favicon.svg">
<title>골프 중독자들</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@500;700&display=swap">
<style>
/* 스코어카드 느낌: 페어웨이 초록 + 깃발 노랑. 게임비 계산기 → 타당 계산기 → 유튜브 타임라인 */
:root {
  --bg: #eef2ec; --panel: #ffffff; --ink: #18211b; --muted: #5d6a61; --line: #d5ddd5; --soft: #f4f7f2;
  --green: #1f6b45; --greenInk: #ffffff; --greenSoft: #e1efe5; --flag: #f2c230; --flagSoft: #fff4cc; --red: #c23b32; --blue: #2457a6;
  --sans: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111612; --panel: #1a211c; --ink: #e8efe9; --muted: #9caaa0; --line: #2f3a32; --soft: #151b17;
    --green: #5cc28a; --greenInk: #0d1410; --greenSoft: #1d3026; --flag: #f2c230; --flagSoft: #3a3218; --red: #ff8a80; --blue: #8ab4ff; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111612; --panel: #1a211c; --ink: #e8efe9; --muted: #9caaa0; --line: #2f3a32; --soft: #151b17;
  --green: #5cc28a; --greenInk: #0d1410; --greenSoft: #1d3026; --flag: #f2c230; --flagSoft: #3a3218; --red: #ff8a80; --blue: #8ab4ff; color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--sans); font-size: 15px; line-height: 1.55; }
.wrap { max-width: 980px; margin: 0 auto; padding: 20px max(16px, env(safe-area-inset-right)) 70px max(16px, env(safe-area-inset-left)); }
header .flag { display: inline-block; width: 10px; height: 26px; background: var(--flag); border-left: 3px solid var(--ink); margin-right: 8px; vertical-align: -4px; clip-path: polygon(0 0, 100% 25%, 0 50%); }
h1 { font-size: 28px; margin: 0; letter-spacing: -.02em; }
h2 { font-size: 20px; margin: 0; }
.sub { color: var(--muted); font-size: 13px; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.between { justify-content: space-between; }
section { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 18px; margin-top: 16px; }
button, input, select, textarea { font: inherit; color: var(--ink); }
button { cursor: pointer; border: 1px solid var(--line); background: var(--panel); border-radius: 10px; padding: 7px 13px; font-size: 14px; }
button.main { background: var(--green); border-color: var(--green); color: var(--greenInk); font-weight: 700; }
button.ghost { border-color: transparent; background: transparent; color: var(--muted); padding: 4px 8px; font-size: 13px; }
button:disabled { opacity: .5; cursor: default; }
input, textarea, select { background: var(--soft); border: 1px solid var(--line); border-radius: 10px; padding: 8px 11px; min-width: 0; }
textarea { width: 100%; min-height: 60px; }
label.f { display: grid; gap: 4px; font-size: 13px; color: var(--muted); }
.won { font-family: var(--mono); font-weight: 700; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chips button { border-radius: 999px; padding: 5px 12px; font-size: 13px; }
.chips button.on { background: var(--ink); border-color: var(--ink); color: var(--panel); font-weight: 700; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px; margin-top: 14px; }
.step { display: inline-flex; align-items: center; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.step button { border: 0; border-radius: 0; padding: 7px 14px; font-size: 18px; line-height: 1; }
.step b { min-width: 46px; text-align: center; font-family: var(--mono); font-size: 18px; }
.money { width: 150px; text-align: right; font-family: var(--mono); font-weight: 700; }
.result { margin-top: 16px; border-top: 2px dashed var(--line); padding-top: 14px; }
.ranks { display: grid; gap: 6px; }
.rk { display: grid; grid-template-columns: 52px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 8px 12px; border-radius: 10px; background: var(--soft); }
.rk .no { font-weight: 700; }
.rk.first { background: var(--flagSoft); }
.rk.first .no::before { content: "🏆 "; }
.rk input { width: 100%; background: var(--panel); padding: 5px 9px; }
.rk .won { font-size: 17px; }
.diff { font-size: 12px; font-weight: 700; margin-left: 6px; }
.diff.minus { color: var(--green); } .diff.plus { color: var(--red); }
.total { margin-top: 10px; font-size: 13px; color: var(--muted); }
.teams { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px; }
.team { border-radius: 12px; padding: 12px 14px; background: var(--soft); }
.team.win { background: var(--flagSoft); }
.team .won { font-size: 22px; display: block; margin-top: 4px; }
.scanbox { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 14px; }
.scanbox .file { position: relative; overflow: hidden; }
.scanbox .file input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
.thumb { max-height: 80px; border-radius: 8px; border: 1px solid var(--line); }
.tw { overflow-x: auto; margin-top: 12px; border: 1px solid var(--line); border-radius: 12px; }
table.sc { border-collapse: collapse; font-family: var(--mono); font-size: 13px; min-width: 100%; }
.sc th, .sc td { border: 1px solid var(--line); text-align: center; padding: 0; height: 34px; min-width: 34px; }
.sc th { background: var(--greenSoft); font-weight: 700; padding: 0 4px; }
.sc th.hole { cursor: pointer; user-select: none; }
.sc th.hole.x2 { background: var(--flag); color: #18211b; }
.sc th.hole.x2::after { content: "×2"; display: block; font-size: 10px; line-height: 1; }
.sc .nm { position: sticky; left: 0; z-index: 1; background: var(--panel); min-width: 92px; text-align: left; }
.sc th.nm { background: var(--greenSoft); padding-left: 8px; }
.sc td input { width: 100%; height: 32px; border: 0; border-radius: 0; background: transparent; text-align: center; padding: 0; font-family: var(--mono); }
.sc td.nm input { text-align: left; padding: 0 8px; font-family: var(--sans); font-weight: 700; }
button.reset { font-size: 13px; font-weight: 700; vertical-align: middle; }
button.reset.warn { color: var(--red); }
.sc tr.par td { background: var(--soft); color: var(--muted); }
.sc .parb { width: 100%; height: 32px; border: 0; border-radius: 0; background: transparent; padding: 0; font-family: var(--mono); color: var(--ink); font-weight: 700; cursor: pointer; }
.sc .parb:hover { background: var(--greenSoft); }
.sc td.nm select { width: 100%; height: 32px; border: 0; border-radius: 0; background: transparent; padding: 0 4px 0 6px; font: inherit; font-weight: 700; color: var(--ink); }
.sc td.sum { font-weight: 700; padding: 0 8px; background: var(--greenSoft); }
.sc td.under input { color: var(--blue); font-weight: 700; } .sc td.over2 input { color: var(--red); }
.net { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 8px; }
.net div { background: var(--soft); border-radius: 10px; padding: 10px 12px; }
.net b { display: block; }
.net .won.plus { color: var(--green); } .net .won.minus { color: var(--red); }
.pay { list-style: none; margin: 12px 0 0; padding: 0; display: grid; gap: 6px; }
.pay li { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; font-size: 16px; }
.pay li .arrow { color: var(--muted); }
.pay li .won { margin-left: auto; font-size: 17px; }
.note { font-size: 12px; color: var(--muted); }
.hint { font-size: 12px; color: var(--muted); margin-top: 6px; }
.db-list { list-style: none; margin: 12px 0 0; padding: 0; display: grid; gap: 8px; }
.db-list li { border: 1px solid var(--line); border-radius: 12px; background: var(--panel); }
.db-list summary { list-style: none; cursor: pointer; padding: 10px 12px; display: grid; grid-template-columns: auto auto minmax(0, 1fr); gap: 4px 10px; align-items: baseline; }
.db-list summary::-webkit-details-marker { display: none; }
.db-list .tm { font-family: var(--mono); font-size: 13px; color: var(--muted); }
.db-list .kd { font-size: 12px; font-weight: 700; border-radius: 999px; padding: 1px 8px; background: var(--greenSoft); color: var(--green); }
.db-list .kd.tadang { background: var(--soft); color: var(--ink); } .db-list .kd.scan { background: var(--flag); color: #18211b; }
.db-list .sm { min-width: 0; overflow-wrap: anywhere; }
.db-list .dt { padding: 0 12px 12px; font-size: 14px; display: grid; gap: 4px; }
.db-list .dt .row { gap: 6px; }
.adminbar { background: var(--greenSoft); border-radius: 12px; padding: 10px 12px; margin-top: 14px; font-size: 14px; }
.form { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); background: var(--soft); border-radius: 12px; padding: 14px; margin-top: 12px; }
.form .full { grid-column: 1 / -1; }
.form input, .form textarea { width: 100%; background: var(--panel); }
.vtl { position: relative; margin-top: 14px; padding-left: 22px; }
.vtl::before { content: ""; position: absolute; left: 6px; top: 8px; bottom: 8px; width: 2px; background: var(--line); }
.vtl-g + .vtl-g { margin-top: 22px; }
.vtl-d { position: relative; font-weight: 700; font-size: 16px; font-family: var(--mono); }
.vtl-d::before { content: ""; position: absolute; left: -21px; top: 50%; width: 12px; height: 12px; margin-top: -6px; border-radius: 50%; background: var(--green); border: 2px solid var(--panel); }
.vids { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; margin-top: 8px; }
@media (max-width: 600px) { .vids { grid-template-columns: minmax(0, 1fr); } }
.vid { border: 1px solid var(--line); border-radius: 12px; overflow: hidden; min-width: 0; }
.frame { position: relative; aspect-ratio: 16 / 9; max-width: 100%; background: #000; }
.frame iframe, .frame button { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
.frame button { padding: 0; border-radius: 0; background: #000 center / cover no-repeat; }
.frame button::after { content: "▶"; position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 60px; height: 42px; border-radius: 12px; background: rgba(200, 40, 40, .92); color: #fff; font-size: 20px; display: grid; place-items: center; }
.cap { padding: 10px 12px; display: flex; gap: 8px; align-items: flex-start; }
.cap .body { flex: 1; min-width: 0; }
.cap .t { font-weight: 700; }
.cap .m { color: var(--muted); font-size: 13px; white-space: pre-wrap; overflow-wrap: anywhere; }
.empty { color: var(--muted); font-size: 14px; padding: 10px 0 2px; }
.gate { max-width: 420px; }
.toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 9px 14px; border-radius: 10px; font-size: 14px; z-index: 9; max-width: 90vw; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1><span class="flag"></span>골프 중독자들</h1>
    <div class="sub">게임비 나누기, 타당 정산, 우리 라운드 영상</div>
  </header>

  <div id="gate" class="gate" hidden>
    <section>
      <h2>들어가기</h2>
      <p class="sub">친구들은 공유 주소로 들어와요. 이현님은 관리자 키를 넣어 주세요.</p>
      <form id="gateForm" class="row" style="margin-top:10px">
        <input id="gateKey" type="password" placeholder="관리자 키" autocomplete="current-password" style="flex:1">
        <button class="main">들어가기</button>
      </form>
      <div id="gateMsg" class="sub"></div>
    </section>
  </div>

  <div id="app" hidden>
    <div id="adminbar" class="adminbar row between" hidden>
      <span>이현님 화면이에요. 친구들은 공유 주소로 계산기와 영상만 볼 수 있어요.</span>
      <span class="row"><button id="copyLink">친구 공유 주소 복사</button><button id="newKey" class="ghost">주소 바꾸기</button></span>
      <div class="chips" id="adminTabs" style="flex-basis:100%"><button data-tab="main" class="on">계산기·영상</button><button data-tab="db">📒 DB (친구들이 쓴 기록)</button></div>
    </div>
    <section id="db" hidden></section>

    <!-- 게임비 계산기 -->
    <section id="fee">
      <div class="row between"><h2>게임비 계산기</h2><button type="button" class="ghost reset" id="feeReset">↺ 리셋</button></div>
      <div class="grid2">
        <label class="f">인원<span class="step"><button type="button" data-n="-1">−</button><b id="nView">3</b><button type="button" data-n="1">＋</button></span></label>
        <label class="f">인당 게임비 (원)<input id="feeIn" class="money" inputmode="numeric" value="20,000"></label>
      </div>
      <div class="grid2">
        <div class="f"><span class="note">방식</span><div class="chips" id="modeChips"><button data-mode="solo" class="on">개인전</button><button data-mode="team">팀전</button></div></div>
        <div class="f"><span class="note">1등 혜택</span><div class="chips" id="benChips">
          <button data-ben="0">없음</button><button data-ben="5000">5천원 할인</button><button data-ben="10000" class="on">1만원 할인</button><button data-ben="20000">2만원 할인</button><button data-ben="free">게임비 무료</button><button data-ben="custom">직접</button>
        </div><input id="benCustom" class="money" inputmode="numeric" placeholder="할인 금액" hidden style="margin-top:6px"></div>
      </div>
      <div class="grid2" id="soloOpt">
        <div class="f"><span class="note">할인분은 누가 내나요</span><div class="chips" id="splitChips"><button data-split="step" class="on">등수마다 차등</button><button data-split="last">꼴등이 냄</button></div></div>
      </div>
      <div class="grid2" id="teamOpt" hidden>
        <label class="f">이긴 팀 인원<span class="step"><button type="button" data-w="-1">−</button><b id="wView">2</b><button type="button" data-w="1">＋</button></span></label>
      </div>
      <div class="result" id="feeOut"></div>
    </section>

    <!-- 타당 계산기 -->
    <section id="tadang">
      <div class="row between"><h2>타당 계산기 <button type="button" class="ghost reset" id="tdReset">↺ 리셋</button></h2>
        <label class="f" style="grid-auto-flow:column;align-items:center">1타당<input id="unitIn" class="money" inputmode="numeric" value="1,000" style="width:110px">원</label></div>
      <div class="chips" id="unitChips" style="margin-top:8px"><button data-u="1000" class="on">1천</button><button data-u="2000">2천</button><button data-u="5000">5천</button><button data-u="10000">1만</button></div>
      <div class="scanbox">
        <span class="file"><button class="main" type="button">📷 스코어표 사진 올리기</button><input id="photo" type="file" accept="image/*"></span>
        <button type="button" id="manual">직접 입력</button>
        <img id="thumb" class="thumb" alt="" hidden>
        <datalist id="friendList"></datalist>
        <span id="scanMsg" class="note"></span>
      </div>
      <div id="scWrap" hidden>
        <div class="row" style="margin-top:12px">
          <label class="row note"><input type="checkbox" id="capOpt"> 양파 상한 (더블파 넘으면 더블파로)</label>
          <span class="note">홀 번호를 누르면 배판(×2)</span>
          <button type="button" class="ghost" id="addP">＋ 사람</button>
          <button type="button" class="ghost" id="holesBtn"></button>
        </div>
        <div class="tw" id="tbl"></div>
        <div class="hint">사진에서 읽은 숫자가 틀리면 칸을 눌러 바로 고치세요. 홀별 칸을 비우고 합계만 넣어도 돼요.</div>
        <div class="result" id="tdOut"></div>
      </div>
    </section>

    <!-- 유튜브 타임라인 -->
    <section id="videos"></section>
  </div>
</div>
<div class="toast" id="toast" hidden></div>

<script>
const API = '/api/golf';
const q = new URLSearchParams(location.search);
const viewKey = q.get('k') || '';
let adminKey = '';
try { adminKey = localStorage.getItem('ai-admin-key') || ''; } catch {}
let videos = [], admin = false, shareKey = '';
const ui = { form: false, edit: null, del: null };

const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const won = (n) => `${Math.round(n).toLocaleString('ko-KR')}원`;
const num = (s) => Number(String(s ?? '').replace(/[^\d.-]/g, '')) || 0;
const DOW = ['일', '월', '화', '수', '목', '금', '토'];
function toast(t) { const el = $('#toast'); el.textContent = t; el.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => (el.hidden = true), 2400); }
const save = (k, v) => { try { localStorage.setItem('golf-' + k, JSON.stringify(v)); } catch {} };
const loadLS = (k, d) => { try { const v = JSON.parse(localStorage.getItem('golf-' + k)); return v ?? d; } catch { return d; } };
function fmtMoneyInput(el) { el.addEventListener('blur', () => { const n = num(el.value); el.value = n ? n.toLocaleString('ko-KR') : ''; }); }

async function api(method, body, qs = '') {
  const h = { 'Content-Type': 'application/json' };
  if (adminKey) h['x-admin-key'] = adminKey;
  const r = await fetch(API + qs, { method, headers: h, body: body ? JSON.stringify({ k: viewKey, ...body }) : undefined });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw Object.assign(new Error(j.error || r.status), { code: j.error, status: r.status });
  return j;
}

/* ───────── 게임비 계산기 ───────── */
const FEE0 = { n: 3, fee: 20000, mode: 'solo', ben: '10000', custom: 0, split: 'step', w: 2, names: [] };
const fee = loadLS('fee', structuredClone(FEE0));
// 리셋: 한 번 누르면 "정말?"으로 바뀌고, 한 번 더 눌러야 지움
function twoTap(btn, run) {
  const back = () => { btn.dataset.sure = ''; btn.textContent = btn.dataset.label; btn.classList.remove('warn'); };
  btn.dataset.label ||= btn.textContent;
  clearTimeout(btn.t);
  if (btn.dataset.sure !== '1') { btn.dataset.sure = '1'; btn.textContent = '정말 할까요?'; btn.classList.add('warn'); btn.t = setTimeout(back, 3000); return; }
  back(); run();
}
const round100 = (x) => Math.round(x / 100) * 100;
function benefit() { return fee.ben === 'free' ? fee.fee : fee.ben === 'custom' ? fee.custom : Number(fee.ben); }
function soloPays() {
  const n = fee.n, f = fee.fee, d = Math.min(benefit(), f);
  if (n < 2 || !d) return Array(n).fill(f);
  let p;
  if (fee.split === 'last') p = Array.from({ length: n }, (_, i) => (i === 0 ? f - d : i === n - 1 ? f + d : f));
  else p = Array.from({ length: n }, (_, i) => round100(f - d + (2 * d * i) / (n - 1)));
  // 반올림 차이는 꼴등 몫에서 맞춰 합계가 인원 × 게임비가 되게
  p[n - 1] += n * f - p.reduce((a, b) => a + b, 0);
  return p;
}
function renderFee() {
  $('#nView').textContent = fee.n; $('#wView').textContent = fee.w;
  document.querySelectorAll('#modeChips button').forEach((b) => b.classList.toggle('on', b.dataset.mode === fee.mode));
  document.querySelectorAll('#benChips button').forEach((b) => b.classList.toggle('on', b.dataset.ben === fee.ben));
  document.querySelectorAll('#splitChips button').forEach((b) => b.classList.toggle('on', b.dataset.split === fee.split));
  $('#benCustom').hidden = fee.ben !== 'custom';
  $('#soloOpt').hidden = fee.mode !== 'solo'; $('#teamOpt').hidden = fee.mode !== 'team';
  const f = fee.fee, total = fee.n * f;
  let h;
  if (fee.mode === 'solo') {
    const p = soloPays();
    h = `<div class="ranks">${p.map((v, i) => `<div class="rk${i === 0 && benefit() ? ' first' : ''}"><span class="no">${i + 1}등</span>
      <input data-name="${i}" list="friendList" value="${esc(fee.names[i] || '')}" placeholder="이름 (안 적어도 돼요)">
      <span class="won">${won(v)}${v !== f ? `<span class="diff ${v < f ? 'minus' : 'plus'}">${v < f ? '−' : '+'}${Math.abs(v - f).toLocaleString('ko-KR')}</span>` : ''}</span></div>`).join('')}</div>`;
  } else {
    const w = Math.min(Math.max(fee.w, 1), fee.n - 1), l = fee.n - w, d = Math.min(benefit(), f);
    const wp = f - d, lp = round100(f + (d * w) / l);
    h = `<div class="teams"><div class="team win"><b>🏆 이긴 팀 ${w}명</b><span class="won">${won(wp)}</span><span class="note">한 사람당</span></div>

    if (wp * w + lp * l !== total) h += `<div class="total">100원 단위로 맞추느라 합계가 ${won(wp * w + lp * l)}이에요.</div>`;
  }
  h += `<div class="total">합계 ${won(total)} = ${fee.n}명 × ${won(f)}</div>`;
  $('#feeOut').innerHTML = h;
  save('fee', fee);
  logFee(fee.mode === 'solo' ? soloPays() : (() => { const w = Math.min(Math.max(fee.w, 1), fee.n - 1), d = Math.min(benefit(), f); return [f - d, round100(f + (d * w) / (fee.n - w))]; })());
}

/* ───────── 타당 계산기 ───────── */
// 타당: 두 사람씩 짝지어 타수 차이 × 1타당 금액. 배판 홀은 그 홀 차이를 두 배로.
let td = loadLS('td', null);
let unit = loadLS('unit', 1000);
// 같이 치는 친구들 (이름 칸에서 고름. 없으면 직접입력)
const FRIENDS = ['현규', '헌진', '진만', '슬기', '민영', '정식'];
function newCard(holes = 18, names = ['1번', '2번', '3번', '4번']) {
  return { holes, par: Array(holes).fill(4), x2: [], cap: false, players: names.map((n) => ({ name: n, scores: Array(holes).fill(null), total: null })) };
}
const holeScore = (p, h) => {
  const s = p.scores[h]; if (s == null) return null;
  const par = td.par[h] || 4;
  return td.cap ? Math.min(s, par * 2) : s;
};
const totalOf = (p) => {
  const filled = p.scores.some((s) => s != null);
  return filled ? p.scores.reduce((a, s, h) => a + (holeScore(p, h) ?? 0), 0) : (p.total || null);
};
function settle() {
  const P = td.players, net = P.map(() => 0);
  for (let i = 0; i < P.length; i++) for (let j = i + 1; j < P.length; j++) {
    const a = P[i], b = P[j];
    const byHole = a.scores.some((s) => s != null) && b.scores.some((s) => s != null);
    let diff = 0; // 양수면 a가 더 많이 쳐서 b에게 줌
    if (byHole) for (let h = 0; h < td.holes; h++) {
      const sa = holeScore(a, h), sb = holeScore(b, h);
      if (sa != null && sb != null) diff += (sa - sb) * (td.x2.includes(h) ? 2 : 1);
    } else {
      const ta = totalOf(a), tb = totalOf(b);
      if (ta && tb) diff = ta - tb;
    }
    net[i] -= diff * unit; net[j] += diff * unit;
  }
  // 받을 사람·줄 사람을 큰 금액부터 맞춰 보내는 횟수를 줄임
  const give = net.map((v, i) => ({ i, v: -v })).filter((x) => x.v > 0).sort((a, b) => b.v - a.v);
  const get = net.map((v, i) => ({ i, v })).filter((x) => x.v > 0).sort((a, b) => b.v - a.v);
  const pays = [];
  for (const g of give) {
    for (const r of get) {
      if (g.v <= 0) break;
      if (r.v <= 0) continue;
      const m = Math.min(g.v, r.v);
      pays.push({ from: g.i, to: r.i, amt: m }); g.v -= m; r.v -= m;
    }
  }
  return { net, pays };
}
function renderTd() {

  td.players.forEach((p, i) => {
    const filled = p.scores.some((s) => s != null);

      const s = p.scores[h], par = td.par[h] || 4, cls = s == null ? '' : s < par ? 'under' : s >= par + 2 ? 'over2' : '';
      return `<td class="${cls}"><input data-ps="${i}|${h}" inputmode="numeric" value="${s ?? ''}"></td>`;
    }).join('')}<td class="sum">${filled ? totalOf(p) : `<input data-pt="${i}" inputmode="numeric" value="${p.total ?? ''}" placeholder="합계" style="width:60px">`}</td>
    <td><button class="ghost" data-pdel="${i}" aria-label="빼기">✕</button></td></tr>`;

  $('#tbl').innerHTML = t + '</tbody></table>';
  renderTdOut();

function renderTdOut() {
  logTd();
  const ready = td.players.filter((p) => totalOf(p)).length >= 2;
  if (!ready) { $('#tdOut').innerHTML = '<div class="note">두 사람 이상 스코어를 넣으면 정산이 나와요.</div>'; return; }
  const { net, pays } = settle(), nm = (i) => esc(td.players[i].name || `${i + 1}번`);
  const order = net.map((v, i) => i).sort((a, b) => (totalOf(td.players[a]) || 999) - (totalOf(td.players[b]) || 999));
  $('#tdOut').innerHTML = `<div class="net">${order.map((i) => `<div><b>${nm(i)} <span class="note">${totalOf(td.players[i]) || '-'}타</span></b><span class="won ${net[i] > 0 ? 'plus' : net[i] < 0 ? 'minus' : ''}">${net[i] > 0 ? '+' : ''}${won(net[i])}</span></div>`).join('')}</div>
    ${pays.length ? `<ul class="pay">${pays.map((p) => `<li><b>${nm(p.from)}</b><span class="arrow">→</span><b>${nm(p.to)}</b><span class="won">${won(p.amt)}</span></li>`).join('')}</ul>` : '<div class="note" style="margin-top:10px">주고받을 돈이 없어요.</div>'}
    <div class="note" style="margin-top:8px">1타당 ${won(unit)}${td.x2.length ? ` · 배판 ${td.x2.map((h) => h + 1).join(', ')}번 홀` : ''}${td.cap ? ' · 양파 상한' : ''}</div>`;
}

// 사진은 브라우저에서 줄여(긴 쪽 1600px) 보냄. 사진은 어디에도 저장하지 않음
function shrink(file) {
  return new Promise((ok, bad) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const s = Math.min(1, 1600 / Math.max(img.width, img.height)), c = document.createElement('canvas');
      c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url); ok(c.toDataURL('image/jpeg', 0.85));
    };
    img.onerror = () => { URL.revokeObjectURL(url); bad(new Error('img')); };
    img.src = url;
  });
}

/* ───────── 사용 기록 (친구들 화면에서만 남김 → 이현님 DB 탭) ───────── */
// 한 번 들어와 쓰는 동안은 같은 줄을 고쳐 씀: 마지막으로 만진 뒤 6초 지나거나 창을 닫을 때 보냄
const SID = Math.random().toString(36).slice(2, 12).padEnd(10, '0');
let logReady = false;
const logQ = {}, logLast = {};
function logSoon(kind, data) {
  if (!logReady || admin) return;
  const j = JSON.stringify(data); if (j === logLast[kind]) return;
  logQ[kind] = data; clearTimeout(logSoon.t); logSoon.t = setTimeout(logFlush, 6000);
}
function logFlush(beacon) {
  for (const kind of Object.keys(logQ)) {
    const data = logQ[kind]; delete logQ[kind]; logLast[kind] = JSON.stringify(data);
    const body = JSON.stringify({ k: viewKey, op: 'log', sid: SID, kind, data });
    if (beacon && navigator.sendBeacon) navigator.sendBeacon(API, body);
    else fetch(API, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body, keepalive: true }).catch(() => {});
  }
}
addEventListener('pagehide', () => logFlush(true));
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') logFlush(true); });
function logFee(pays) { logSoon('fee', { n: fee.n, fee: fee.fee, mode: fee.mode, ben: benefit(), split: fee.split, w: fee.w, names: fee.names.slice(0, fee.n), pays }); }
function logTd() {
  if (!td) return;
  const ok = td.players.filter((p) => totalOf(p)).length >= 2, r = ok ? settle() : { net: [], pays: [] }, nm = (i) => td.players[i].name || `${i + 1}번`;
  logSoon('tadang', { unit, holes: td.holes, x2: td.x2.map((h) => h + 1), cap: td.cap, players: td.players.map((p, i) => ({ name: nm(i), total: totalOf(p) || null, net: r.net[i] ?? 0 })), pays: r.pays.map((p) => ({ from: nm(p.from), to: nm(p.to), amt: p.amt })) });
}

const db = { logs: null, kind: 'all', open: '' };
const DB_KINDS = [['all', '전체'], ['fee', '게임비'], ['tadang', '타당'], ['scan', '사진 읽기']];
const man = (v) => (v >= 10000 && v % 10000 === 0 ? `${v / 10000}만원` : won(v));
function dbSummary(r) {
  const d = r.data || {};
  if (r.kind === 'fee') return `${d.n}명 · ${man(d.fee)} · ${d.mode === 'team' ? `팀전(이긴 팀 ${d.w}명)` : '개인전'}${d.ben ? ` · 1등 ${man(d.ben)} 할인` : ''}`;
  if (r.kind === 'tadang') return `${(d.players || []).filter((p) => p.total).map((p) => `${p.name} ${p.total}타`).join(', ') || '스코어 입력 전'} · 1타 ${man(d.unit)}`;
  return d.ok ? `${d.players}명 읽음${d.names ? ` (${d.names.join(', ')})` : ''}` : `실패 (${d.error || '?'})`;
}
function dbDetail(r) {
  const d = r.data || {};
  let h = '';
  if (r.kind === 'fee' && d.pays) h = d.mode === 'team' ? `<div>이긴 팀 한 사람 ${won(d.pays[0])}, 진 팀 한 사람 ${won(d.pays[1])}</div>`
    : d.pays.map((v, i) => `<div>${i + 1}등 ${esc(d.names?.[i] || '')} <b>${won(v)}</b></div>`).join('');
  if (r.kind === 'tadang') h = (d.pays?.length ? d.pays.map((p) => `<div>${esc(p.from)} → ${esc(p.to)} <b>${won(p.amt)}</b></div>`).join('') : '<div class="note">정산 전</div>')
    + `<div class="note">${d.holes}홀${d.x2?.length ? ` · 배판 ${d.x2.join(', ')}번` : ''}${d.cap ? ' · 양파 상한' : ''}</div>`;
  if (r.kind === 'scan' && d.note) h = `<div class="note">${esc(d.note)}</div>`;
  const t = (x) => new Date(x + 9 * 3600e3).toISOString().slice(11, 16);
  return h + `<div class="note">${r.dev} · ${t(r.first)}~${t(r.at)} 사용 · 접속 ${esc(r.sid)}</div><div><button class="ghost" data-dbdel="${esc(r.id)}">이 기록 지우기</button></div>`;
}
async function renderDb(reload) {
  const box = $('#db');
  if (reload || !db.logs) {
    box.innerHTML = '<h2>DB</h2><div class="note">불러오는 중…</div>';
    try { db.logs = (await api('GET', null, '?logs=1')).logs; } catch { box.innerHTML = '<h2>DB</h2><div class="note">불러오지 못했어요.</div>'; return; }
  }
  const L = db.logs.filter((r) => db.kind === 'all' || r.kind === db.kind);
  const day = (x) => new Date(x + 9 * 3600e3).toISOString().slice(0, 10), dow = (x) => '일월화수목금토'[new Date(x + 9 * 3600e3).getUTCDay()];
  let last = '', rows = '';
  L.forEach((r) => {
    const dd = day(r.at);
    if (dd !== last) { rows += `<li style="border:0;background:none"><b>${dd.replaceAll('-', '.')} (${dow(r.at)})</b></li>`; last = dd; }
    rows += `<li><details${db.open === r.id ? ' open' : ''} data-dbid="${esc(r.id)}"><summary><span class="tm">${new Date(r.at + 9 * 3600e3).toISOString().slice(11, 16)}</span><span class="kd ${r.kind}">${DB_KINDS.find((k) => k[0] === r.kind)[1]}</span><span class="sm">${esc(dbSummary(r))}</span></summary><div class="dt">${dbDetail(r)}</div></details></li>`;
  });
  const cnt = (k) => db.logs.filter((r) => k === 'all' || r.kind === k).length;
  box.innerHTML = `<div class="row between"><h2>DB · 친구들이 쓴 기록</h2><span class="row"><button class="ghost" data-dbre>새로고침</button><button class="ghost reset" data-dball>전부 지우기</button></span></div>
    <div class="note">친구 공유 주소로 들어온 사람이 계산기를 쓰면 자동으로 쌓여요 (이현님 화면에서 쓴 건 안 남아요). 최근 400개까지.</div>
    <div class="chips" style="margin-top:10px">${DB_KINDS.map(([k, l]) => `<button data-dbk="${k}" class="${db.kind === k ? 'on' : ''}">${l} ${cnt(k)}</button>`).join('')}</div>
    ${L.length ? `<ul class="db-list">${rows}</ul>` : '<div class="note" style="margin-top:12px">아직 기록이 없어요.</div>'}`;
}
$('#adminTabs').addEventListener('click', (e) => {
  const b = e.target.closest('[data-tab]'); if (!b) return;
  const isDb = b.dataset.tab === 'db';
  document.querySelectorAll('#adminTabs button').forEach((x) => x.classList.toggle('on', x === b));
  ['fee', 'tadang', 'videos'].forEach((id) => ($('#' + id).hidden = isDb));
  $('#db').hidden = !isDb;
  if (isDb) renderDb(true);
});
$('#db').addEventListener('toggle', (e) => { if (e.target.open) db.open = e.target.dataset.dbid; }, true);
$('#db').addEventListener('click', async (e) => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.dbk) { db.kind = b.dataset.dbk; renderDb(); }
  else if ('dbre' in b.dataset) renderDb(true);
  else if (b.dataset.dbdel) { await api('POST', { op: 'logDel', id: b.dataset.dbdel }).catch(() => {}); db.logs = db.logs.filter((r) => r.id !== b.dataset.dbdel); renderDb(); }
  else if ('dball' in b.dataset) twoTap(b, async () => { await api('POST', { op: 'logDel', all: true }).catch(() => {}); db.logs = []; renderDb(); toast('기록을 모두 지웠어요'); });
});

/* ───────── 들어가기·공유 ───────── */
async function load() {
  try {
    const j = await api('GET', null, viewKey ? `?k=${encodeURIComponent(viewKey)}` : '');
    videos = j.videos; admin = j.admin; shareKey = j.key || '';
    $('#gate').hidden = true; $('#app').hidden = false; $('#adminbar').hidden = !admin;
    renderFee(); setUnit(unit); renderTd(); renderVideos();
    logReady = true; logLast.fee = null;
  } catch (e) {
    $('#app').hidden = true; $('#gate').hidden = false;
    if (e.code === 'no_redis') $('#gateMsg').textContent = '저장소가 아직 연결되지 않았어요.';
    else if (viewKey) $('#gateMsg').textContent = '주소가 바뀌었거나 맞지 않아요. 이현님께 새 주소를 받아 주세요.';
    else if (adminKey) $('#gateMsg').textContent = '관리자 키가 맞지 않아요.';
  }
}
$('#gateForm').addEventListener('submit', (e) => {
  e.preventDefault(); adminKey = $('#gateKey').value.trim();
  try { localStorage.setItem('ai-admin-key', adminKey); } catch {}
  load();
});
$('#copyLink').addEventListener('click', async () => {
  const url = `${location.origin}${location.pathname}?k=${shareKey}`;
  try { await navigator.clipboard.writeText(url); toast('친구 공유 주소를 복사했어요'); } catch { prompt('주소를 복사하세요', url); }
});
$('#newKey').addEventListener('click', async (e) => {
  const t = e.currentTarget;
  if (t.dataset.sure !== '1') { t.dataset.sure = '1'; t.textContent = '예전 주소는 막혀요. 바꿀까요?'; return; }
  try { shareKey = (await api('POST', { op: 'newKey' })).key; toast('새 주소로 바꿨어요. 다시 복사해 보내 주세요'); } catch { toast('바꾸지 못했어요'); }
  t.dataset.sure = ''; t.textContent = '주소 바꾸기';
});

if (!viewKey && !adminKey) $('#gate').hidden = false; else load();
</script>
