<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#000000">
<link rel="icon" href="/favicon.svg">
<title>동기부여 저장소</title>
<style>
/* 들어가자마자 화면 가득 영상이 랜덤으로 이어서 나오고, 등록·목록은 스크롤 아래에 */
:root {
  --bg: #000; --panel: #111; --ink: #f2f2f2; --muted: #9a9a9a; --line: #262626; --soft: #1a1a1a;
  --accent: #ffcc33; --accentInk: #111; --danger: #ff7a70;
  --sans: "Apple SD Gothic Neo", "Malgun Gothic", "Pretendard", system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--sans); }
button, input, textarea { font: inherit; color: var(--ink); }
button { cursor: pointer; border: 1px solid var(--line); background: var(--soft); border-radius: 10px; padding: 8px 14px; font-size: 14px; }
button.main { background: var(--accent); border-color: var(--accent); color: var(--accentInk); font-weight: 700; }
button.ghost { background: transparent; border-color: transparent; color: var(--muted); }

#stage { position: relative; height: 100vh; height: 100dvh; background: #000; overflow: hidden; }
#player, #player iframe { position: absolute; inset: 0; width: 100%; height: calc(100% - 64px); border: 0; }
#start { position: absolute; inset: 0; display: grid; place-items: center; background: radial-gradient(circle at 50% 45%, #222 0, #000 70%); border: 0; border-radius: 0; z-index: 3; text-align: center; }
#start b { display: block; font-size: 30px; letter-spacing: -.02em; }
#start span { display: block; color: var(--muted); font-size: 15px; margin-top: 8px; }
#start .play { width: 92px; height: 92px; border-radius: 50%; background: var(--accent); color: #111; display: grid; place-items: center; font-size: 38px; margin: 0 auto 18px; padding-left: 6px; }
#bar { position: absolute; left: 0; right: 0; bottom: 0; height: 64px; display: flex; align-items: center; gap: 6px; padding: 0 max(12px, env(safe-area-inset-right)) env(safe-area-inset-bottom) max(12px, env(safe-area-inset-left)); background: #000; z-index: 2; }
#bar button { background: transparent; border: 0; font-size: 22px; padding: 6px 10px; color: var(--ink); }
#bar .info { flex: 1; min-width: 0; font-size: 13px; color: var(--muted); line-height: 1.3; }
#bar .info b { display: block; color: var(--ink); font-weight: 600; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#down { font-size: 13px !important; color: var(--muted) !important; white-space: nowrap; }
#toast { position: absolute; left: 50%; top: 16px; transform: translateX(-50%); background: rgba(30,30,30,.92); padding: 8px 14px; border-radius: 999px; font-size: 13px; z-index: 4; max-width: 90%; }
#empty { position: absolute; inset: 0 0 64px; display: grid; place-items: center; text-align: center; color: var(--muted); padding: 20px; }

.wrap { max-width: 860px; margin: 0 auto; padding: 26px max(16px, env(safe-area-inset-right)) 60px max(16px, env(safe-area-inset-left)); }
h2 { font-size: 20px; margin: 0 0 4px; }
.sub { color: var(--muted); font-size: 14px; }
section { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 18px; margin-top: 16px; }
textarea, input { width: 100%; background: #000; border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; min-width: 0; }
textarea { min-height: 84px; resize: vertical; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 10px; }
.msg { font-size: 13px; color: var(--muted); }
.stats { display: flex; gap: 18px; margin-top: 10px; flex-wrap: wrap; }
.stats div { font-size: 13px; color: var(--muted); }
.stats b { display: block; font-size: 22px; color: var(--ink); }
.list { list-style: none; padding: 0; margin: 14px 0 0; display: grid; gap: 8px; }
.it { display: flex; gap: 12px; align-items: center; padding: 8px; border: 1px solid var(--line); border-radius: 12px; }
.it.now { border-color: var(--accent); }
.it img { width: 112px; height: 63px; object-fit: cover; border-radius: 8px; flex: none; background: #222; }
.it .t { flex: 1; min-width: 0; }
.it .t b { display: block; font-size: 14px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.it .t span { font-size: 12px; color: var(--muted); }
.it .act { display: flex; gap: 4px; flex: none; }
.it .act button { padding: 6px 10px; }
.sort { display: flex; gap: 6px; margin-top: 12px; flex-wrap: wrap; }
.sort button.on { border-color: var(--accent); color: var(--accent); }
@media (max-width: 520px) { .it img { width: 88px; height: 50px; } #bar .info { font-size: 12px; } }
</style>
</head>
<body>
<div id="stage">
  <div id="player"></div>
  <div id="empty" hidden></div>
  <button id="start" type="button"><div><div class="play">▶</div><b>몰입 시작</b><span id="startSub">랜덤으로 이어서 나와요</span></div></button>
  <div id="toast" hidden></div>
  <div id="bar">
    <button id="prev" type="button" aria-label="이전">⏮</button>
    <button id="pp" type="button" aria-label="재생/멈춤">⏸</button>
    <button id="next" type="button" aria-label="다음">⏭</button>
    <div class="info"><b id="nowT">　</b><span id="nowN"></span></div>
    <button id="down" type="button">등록 ↓</button>
  </div>
</div>

<div class="wrap" id="below">
  <section id="gate" hidden>
    <h2>관리자 키</h2>
    <div class="sub">이현님만 보는 저장소예요. 다른 프로그램에서 넣은 키가 있으면 자동으로 들어와요.</div>
    <div class="row"><input id="gateKey" type="password" placeholder="관리자 키" autocomplete="current-password"><button class="main" id="gateBtn" type="button">들어가기</button></div>
    <div class="msg" id="gateMsg"></div>
  </section>

  <div id="app" hidden>
    <section>
      <h2>영상 등록</h2>
      <div class="sub">유튜브 주소를 붙여 넣으세요. 여러 개는 줄을 바꿔서 한 번에 넣을 수 있어요. 쇼츠도 돼요.</div>
      <textarea id="urls" placeholder="https://www.youtube.com/watch?v=...&#10;https://youtube.com/shorts/..."></textarea>
      <div class="row"><button class="main" id="addBtn" type="button">등록</button><span class="msg" id="addMsg"></span></div>
    </section>

    <section>
      <h2>저장된 영상</h2>
      <div class="stats" id="stats"></div>
      <div class="sort" id="sort">
        <button type="button" data-s="new" class="on">최신 등록순</button>
        <button type="button" data-s="plays">많이 본 순</button>
        <button type="button" data-s="least">덜 본 순</button>
      </div>
      <ul class="list" id="list"></ul>
    </section>
  </div>
</div>

<script>
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
let adminKey = '';
try { adminKey = localStorage.getItem('ai-admin-key') || ''; } catch {}
let sortBy = 'new';
try { sortBy = localStorage.getItem('motiv-sort') || 'new'; } catch {}

let items = [], order = [], pos = -1, player = null, ready = false, started = false, counted = new Set(), playing = false;

async function api(method, body) {
  const r = await fetch('/api/motiv', { method, headers: { 'x-admin-key': adminKey, ...(body ? { 'Content-Type': 'application/json' } : {}) }, body: body ? JSON.stringify(body) : undefined });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw Object.assign(new Error(j.error || r.status), { code: j.error || r.status });
  return j;
}
function toast(t) { const el = $('#toast'); el.textContent = t; el.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => (el.hidden = true), 2600); }

// 한 바퀴 다 볼 때까지 같은 영상이 다시 안 나오게 섞기
function shuffle(ids) { const a = ids.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function reshuffle(keepFirst) {
  const ids = items.map((it) => it.id);
  let a = shuffle(ids);
  if (keepFirst && a.length > 1 && a[0] === keepFirst) [a[0], a[1]] = [a[1], a[0]]; // 한 바퀴 끝과 새 바퀴 처음이 같지 않게
  order = a;
}
const cur = () => items.find((it) => it.id === order[pos]);

function showNow() {
  const it = cur();
  $('#nowT').textContent = it ? (it.title || '제목 없음') : '　';
  $('#nowN').textContent = it ? `${pos + 1} / ${order.length}${it.by ? ' · ' + it.by : ''}` : '';
  document.querySelectorAll('.it').forEach((el) => el.classList.toggle('now', !!it && el.dataset.id === it.id));
}
function go(n) {
  if (!items.length) return;
  pos = n;
  if (pos >= order.length) { const last = order[order.length - 1]; reshuffle(last); pos = 0; toast('한 바퀴 다 봤어요. 다시 섞었어요'); }
  if (pos < 0) pos = 0;
  showNow();
  if (ready) player.loadVideoById(order[pos]);
}
function playId(id) { const i = order.indexOf(id); if (i >= 0) { unlock(); go(i); window.scrollTo({ top: 0, behavior: 'smooth' }); } }

function unlock() { started = true; $('#start').hidden = true; }
function begin() { unlock(); if (ready && pos >= 0) player.loadVideoById(order[pos]); }

window.onYouTubeIframeAPIReady = () => {
  player = new YT.Player('player', {
    width: '100%', height: '100%',
    playerVars: { autoplay: 0, rel: 0, playsinline: 1, modestbranding: 1 },
    events: {
      onReady: () => { ready = true; if (started && pos >= 0) player.loadVideoById(order[pos]); },
      onStateChange: (e) => {
        playing = e.data === YT.PlayerState.PLAYING;
        $('#pp').textContent = playing ? '⏸' : '▶';
        if (e.data === YT.PlayerState.ENDED) go(pos + 1);
        if (playing) { const id = order[pos]; if (id && !counted.has(id)) { counted.add(id); api('POST', { op: 'play', id }).then((j) => { const k = items.findIndex((x) => x.id === id); if (k >= 0) { items[k] = j.item; renderList(); } }).catch(() => {}); } }
      },
      onError: () => { toast('재생이 막힌 영상이라 다음으로 넘어가요'); setTimeout(() => go(pos + 1), 900); },
    },
  });
};
function loadYT() { const s = document.createElement('script'); s.src = 'https://www.youtube.com/iframe_api'; document.head.appendChild(s); }

function renderStage() {
  const none = !items.length;
  $('#empty').hidden = !none;
  if (none) { $('#empty').innerHTML = adminKey ? '아직 저장된 영상이 없어요.<br>아래 <b>등록</b>에서 유튜브 주소를 넣어 주세요.' : '아래에서 관리자 키를 넣으면 시작돼요.'; $('#start').hidden = true; }
  else if (!started) $('#start').hidden = false;
  $('#startSub').textContent = none ? '' : `저장된 영상 ${items.length}개가 랜덤으로 이어서 나와요`;
}
function renderList() {
  const total = items.reduce((s, it) => s + (it.plays || 0), 0);
  $('#stats').innerHTML = `<div><b>${items.length}</b>저장한 영상</div><div><b>${total}</b>총 재생</div>`;
  const list = items.slice().sort((a, b) => sortBy === 'plays' ? (b.plays || 0) - (a.plays || 0) : sortBy === 'least' ? (a.plays || 0) - (b.plays || 0) : b.at - a.at);
  $('#list').innerHTML = list.map((it) => `<li class="it" data-id="${esc(it.id)}">
    <img src="https://i.ytimg.com/vi/${esc(it.id)}/mqdefault.jpg" alt="" loading="lazy">
    <div class="t"><b>${esc(it.title || it.id)}</b><span>${esc(it.by || '')}${it.by ? ' · ' : ''}${it.plays || 0}번 봄 · ${new Date(it.at).toLocaleDateString('ko-KR')} 등록</span></div>
    <div class="act"><button type="button" data-play="${esc(it.id)}" aria-label="지금 보기">▶</button><button type="button" class="ghost" data-del="${esc(it.id)}" aria-label="삭제">✕</button></div>
  </li>`).join('') || '<li class="msg">아직 없어요.</li>';
  document.querySelectorAll('#sort button').forEach((b) => b.classList.toggle('on', b.dataset.s === sortBy));
  showNow();
}

async function load() {
  try {
    const j = await api('GET');
    items = j.items || [];
    $('#gate').hidden = true; $('#app').hidden = false;
    reshuffle(); pos = items.length ? 0 : -1;
    renderStage(); renderList();
    if (!started) window.scrollTo(0, 0);
  } catch (e) {
    $('#gate').hidden = false; $('#app').hidden = true;
    $('#gateMsg').textContent = e.code === 'auth' && adminKey ? '관리자 키가 맞지 않아요.' : e.code === 'auth' ? '' : '불러오지 못했어요. 잠시 뒤 다시 열어 주세요.';
    items = []; renderStage();
  }
}

$('#start').onclick = begin;
$('#next').onclick = () => { unlock(); go(pos + 1); };
$('#prev').onclick = () => { unlock(); go(pos - 1); };
$('#pp').onclick = () => { if (!started) return begin(); if (!ready) return; playing ? player.pauseVideo() : player.playVideo(); };
$('#down').onclick = () => $('#below').scrollIntoView({ behavior: 'smooth' });
document.addEventListener('keydown', (e) => {
  if (e.target.closest('input, textarea')) return;
  if (e.key === 'ArrowRight') $('#next').click();
  else if (e.key === 'ArrowLeft') $('#prev').click();
  else if (e.key === ' ') { e.preventDefault(); $('#pp').click(); }
});
$('#gateBtn').onclick = () => { adminKey = $('#gateKey').value.trim(); try { localStorage.setItem('ai-admin-key', adminKey); } catch {} load(); };
$('#gateKey').onkeydown = (e) => { if (e.key === 'Enter') $('#gateBtn').click(); };
$('#sort').onclick = (e) => { const b = e.target.closest('[data-s]'); if (!b) return; sortBy = b.dataset.s; try { localStorage.setItem('motiv-sort', sortBy); } catch {} renderList(); };
$('#addBtn').onclick = async () => {
  const urls = $('#urls').value.split(/[\s,]+/).filter(Boolean);
  if (!urls.length) return;
  $('#addBtn').disabled = true; $('#addMsg').textContent = '등록하는 중…';
  try {
    const j = await api('POST', { op: 'add', urls });
    items = items.concat(j.added);
    // 새 영상은 지금 보는 것 바로 다음부터 섞어 넣기
    const fresh = shuffle(j.added.map((a) => a.id));
    if (pos < 0) { order = fresh; pos = 0; } else order.splice(pos + 1, 0, ...fresh);
    $('#urls').value = j.bad.length ? j.bad.join('\n') : '';
    $('#addMsg').textContent = [j.added.length && `${j.added.length}개 등록했어요`, j.dup.length && `${j.dup.length}개는 이미 있어요`, j.bad.length && `${j.bad.length}개는 유튜브 주소가 아니에요`].filter(Boolean).join(' · ') || '새로 넣을 게 없어요';
    renderStage(); renderList();
  } catch (e) { $('#addMsg').textContent = '등록하지 못했어요. 다시 눌러 주세요.'; }
  $('#addBtn').disabled = false;
};
$('#list').onclick = async (e) => {
  const p = e.target.closest('[data-play]'); if (p) return playId(p.dataset.play);
  const d = e.target.closest('[data-del]'); if (!d) return;
  const id = d.dataset.del, it = items.find((x) => x.id === id);
  if (!confirm(`'${it?.title || id}' 영상을 저장소에서 뺄까요?`)) return;
  try {
    await api('POST', { op: 'del', id });
    const wasNow = order[pos] === id, i = order.indexOf(id);
    items = items.filter((x) => x.id !== id);
    if (i >= 0) { order.splice(i, 1); if (i < pos) pos--; }
    if (!items.length) { pos = -1; if (ready) player.stopVideo(); }
    else if (wasNow) go(Math.min(pos, order.length - 1));
    renderStage(); renderList();
  } catch { toast('삭제하지 못했어요'); }
};

loadYT();
load();
</script>
</body>
</html>
