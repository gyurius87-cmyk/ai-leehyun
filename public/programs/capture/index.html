<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.svg">
<title>웹페이지 전체 캡처</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* 주소 넣기 → 서버 크롬이 페이지 끝까지 찍어 JPG로 → 받기·복사 */
:root {
  --bg: #eef0f2; --panel: #ffffff; --ink: #1f2328; --muted: #5f6670; --line: #d5d9de;
  --charcoal: #24272c; --on-charcoal: #f4f5f6; --yellow: #f5d33f; --good: #2b8a3e; --bad: #d9480f;
  --sans: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --bg: #17191c; --panel: #212429; --ink: #eceef0; --muted: #9aa1aa; --line: #343840; --good: #51b768; --bad: #ff7a45; }
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--sans); font-size: 15px; line-height: 1.55; }
.top { background: var(--charcoal); color: var(--on-charcoal); padding: 20px 0 54px; }
.wrap { max-width: 860px; margin: 0 auto; padding: 0 16px; }
.brand { color: inherit; text-decoration: none; font-family: var(--mono); font-size: 13px; }
.brand b { color: var(--yellow); font-weight: 500; }
h1 { margin: 6px 0 0; font-size: 24px; }
h1 small { font-size: 13px; font-weight: 500; color: #b8bdc4; margin-left: 8px; }
main { margin-top: -36px; display: grid; gap: 14px; padding-bottom: 40px; }
.box { background: var(--panel); border-radius: 14px; padding: 18px; box-shadow: 0 6px 20px rgba(0,0,0,.06); min-width: 0; }
h2 { margin: 0 0 10px; font-size: 16px; }
input[type=text], input[type=password] { flex: 1 1 260px; min-width: 0; border: 1px solid var(--line); border-radius: 10px; padding: 11px 12px; font: 14px var(--mono); background: var(--bg); color: var(--ink); }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.row + .row { margin-top: 10px; }
.btn { border: 0; border-radius: 10px; padding: 11px 18px; font: inherit; font-weight: 700; cursor: pointer; }
.btn.main { background: var(--charcoal); color: #fff; }
.btn.sub { background: var(--yellow); color: #222; }
.btn:disabled { opacity: .5; cursor: default; }
.seg { display: inline-flex; background: var(--bg); border-radius: 10px; padding: 3px; gap: 2px; }
.seg button { border: 0; background: transparent; color: var(--muted); font: inherit; font-size: 14px; padding: 6px 12px; border-radius: 8px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--panel); color: var(--ink); font-weight: 700; box-shadow: 0 1px 3px rgba(0,0,0,.1); }
.msg { margin-top: 10px; font-size: 14px; color: var(--muted); min-height: 1.5em; }
.msg.ok { color: var(--good); } .msg.no { color: var(--bad); }
.info { font-family: var(--mono); font-size: 13px; color: var(--muted); }
.view { margin-top: 12px; max-height: 70vh; overflow: auto; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); }
.view img { display: block; width: 100%; height: auto; }
.note { font-size: 13px; color: var(--muted); margin: 8px 0 0; }
button:focus-visible, input:focus-visible { outline: 3px solid var(--yellow); outline-offset: 2px; }
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <a class="brand" href="/programs"><b>AI이현</b> / 프로그램</a>
  <h1>웹페이지 전체 캡처<small>주소 → 긴 JPG 한 장</small></h1>
</div></header>
<div class="wrap"><main>
  <section class="box" id="gate" hidden>
    <h2>관리자 키</h2>
    <form class="row" id="keyForm"><input type="password" id="keyIn" placeholder="관리자 키" autocomplete="current-password" aria-label="관리자 키"><button class="btn main">들어가기</button></form>
    <p class="note">이현님만 쓰는 프로그램이에요. 한 번 넣으면 이 브라우저가 기억해요.</p>
  </section>

  <section class="box" id="app" hidden>
    <form class="row" id="form">
      <input type="text" inputmode="url" id="url" placeholder="https://캡처할 페이지 주소" required autocomplete="off" aria-label="페이지 주소">
      <button class="btn main" id="go">캡처</button>
    </form>
    <div class="row">
      <span class="seg" role="group" aria-label="화면 크기">
        <button type="button" data-dev="pc" aria-pressed="true">PC 화면 (1280)</button>
        <button type="button" data-dev="mobile" aria-pressed="false">모바일 화면 (390)</button>
      </span>
    </div>
    <p class="msg" id="msg"></p>
    <div id="result" hidden>
      <div class="row">
        <button type="button" class="btn sub" id="dl">JPG 다운로드</button>
        <button type="button" class="btn main" id="copy">이미지 복사</button>
        <span class="info" id="info"></span>
      </div>
      <div class="view"><img id="img" alt="캡처한 페이지"></div>
    </div>
  </section>
  <p class="note">페이지를 끝까지 천천히 내려서 늦게 뜨는 사진까지 불러온 뒤 찍어요. 한 장은 최대 16,000px 높이까지예요. 글자가 깨지지 않는 선에서 JPG 용량을 가장 작게 맞춰요. 로그인해야 보이는 페이지는 로그인 전 화면이 찍혀요.</p>
</main></div>
<script>
const $ = (id) => document.getElementById(id);
let key = ""; try { key = localStorage.getItem("ai-admin-key") || ""; } catch {}
let dev = "pc", blob = null, name = "capture.jpg";
const show = () => { $("gate").hidden = !!key; $("app").hidden = !key; if (key) $("url").focus(); };
show();
$("keyForm").onsubmit = (e) => { e.preventDefault(); key = $("keyIn").value.trim(); if (!key) return; try { localStorage.setItem("ai-admin-key", key); } catch {} show(); };
document.querySelectorAll("[data-dev]").forEach((b) => (b.onclick = () => { dev = b.dataset.dev; document.querySelectorAll("[data-dev]").forEach((x) => x.setAttribute("aria-pressed", x === b)); }));
const say = (t, cls = "") => { $("msg").textContent = t; $("msg").className = "msg " + cls; };
const kb = (n) => n > 1048576 ? (n / 1048576).toFixed(1) + "MB" : Math.round(n / 1024) + "KB";

$("form").onsubmit = async (e) => {
  e.preventDefault();
  let u = $("url").value.trim(); if (!/^https?:\/\//i.test(u)) u = "https://" + u;
  $("go").disabled = true; $("result").hidden = true;
  const t0 = Date.now(), tick = setInterval(() => say(`찍는 중… ${Math.round((Date.now() - t0) / 1000)}초 (보통 10~30초)`), 1000);
  say("찍는 중…");
  try {
    const r = await fetch("/api/capture", { method: "POST", headers: { "Content-Type": "application/json", "x-admin-key": key }, body: JSON.stringify({ url: u, device: dev }) });
    if (r.status === 401) { key = ""; try { localStorage.removeItem("ai-admin-key"); } catch {} show(); throw "관리자 키가 맞지 않아요. 다시 넣어 주세요."; }
    if (!r.ok) { const j = await r.json().catch(() => ({})); throw j.error === "url" ? "주소를 확인해 주세요." : j.error === "too_big" ? "페이지가 너무 커서 한 장에 담지 못했어요." : "캡처에 실패했어요. 잠시 뒤 다시 해 주세요."; }
    blob = await r.blob();
    const host = new URL(u).hostname.replace(/^www\./, ""), d = new Date();
    name = `${host}_${d.getFullYear()}${String(d.getMonth() + 1).padStart(2, "0")}${String(d.getDate()).padStart(2, "0")}_${String(d.getHours()).padStart(2, "0")}${String(d.getMinutes()).padStart(2, "0")}.jpg`;
    $("img").src = URL.createObjectURL(blob);
    const [w, h] = (r.headers.get("X-Size") || "x").split("x");
    $("info").textContent = `${w}×${h}px · ${kb(blob.size)}`;
    $("result").hidden = false;
    say(r.headers.get("X-Cut") === "1" ? "다 찍었어요. 아주 긴 페이지라 16,000px에서 잘랐어요." : `다 찍었어요 (${Math.round((Date.now() - t0) / 1000)}초).`, "ok");
  } catch (err) { say(typeof err === "string" ? err : "인터넷 연결을 확인해 주세요.", "no"); }
  finally { clearInterval(tick); $("go").disabled = false; }
};

$("dl").onclick = () => { if (!blob) return; const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); a.remove(); };
// 클립보드는 PNG만 받아서, 복사할 때만 PNG로 바꿔 넣어요
$("copy").onclick = async () => {
  if (!blob) return;
  try {
    const png = new Promise(async (ok, no) => { try { const bm = await createImageBitmap(blob); const c = document.createElement("canvas"); c.width = bm.width; c.height = bm.height; c.getContext("2d").drawImage(bm, 0, 0); c.toBlob((b) => (b ? ok(b) : no()), "image/png"); } catch (e) { no(e); } });
    await navigator.clipboard.write([new ClipboardItem({ "image/png": png })]);
    say("이미지를 복사했어요. 붙여 넣을 곳에서 Ctrl+V 하세요.", "ok");
  } catch { say("이 브라우저에서는 복사가 안 돼요. JPG 다운로드를 써 주세요.", "no"); }
};
</script>
</body>
</html>
