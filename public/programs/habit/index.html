<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.svg">
<title>습관 챌린지</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* 엑셀 체크표 모양: 달 탭 → 나는 누구 → 날짜×습관 표(주차별) → 달성률·목표·달성 */
:root {
  --bg: #f3f4f1; --panel: #ffffff; --ink: #1d2120; --muted: #646b68; --line: #cfd4d1; --grid: #e4e7e5;
  --sat: #dbe6fb; --sun: #f6d9d6; --sunInk: #c4382b; --today: #fff3a6; --off: #f1f2f0; --acc: #2f7d57; --accInk: #ffffff; --week: #1d2120; --onWeek: #f3f4f1;
  --sans: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #151817; --panel: #1e2221; --ink: #e9ecea; --muted: #9aa29e; --line: #353b39; --grid: #2a2f2d;
    --sat: #1f2a3d; --sun: #3b2422; --sunInk: #ff8a7d; --today: #4a4220; --off: #191c1b; --acc: #5cc08d; --accInk: #0d1411; --week: #e9ecea; --onWeek: #151817; color-scheme: dark;
  }
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--sans); font-size: 15px; line-height: 1.5; }
.wrap { max-width: 1100px; margin: 0 auto; padding: 18px max(16px, env(safe-area-inset-right)) 60px max(16px, env(safe-area-inset-left)); }
a { color: inherit; }
.brand { font-family: var(--mono); font-size: 13px; color: var(--muted); text-decoration: none; }
h1 { font-size: 24px; margin: 6px 0 2px; letter-spacing: -.02em; text-wrap: balance; }
.sub { color: var(--muted); font-size: 13px; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px; margin-top: 14px; }
button, input, select { font: inherit; color: var(--ink); }
button { cursor: pointer; border: 1px solid var(--line); background: var(--panel); border-radius: 8px; padding: 7px 12px; }
button.main { background: var(--acc); border-color: var(--acc); color: var(--accInk); font-weight: 700; }
button:disabled { opacity: .5; cursor: default; }
input[type=text], input[type=password], select { background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; min-width: 0; }
.tabs { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; margin-top: 14px; }
.tabs button { flex: none; border-radius: 20px; }
.tabs button.on { background: var(--week); color: var(--onWeek); border-color: var(--week); font-weight: 700; }
.me { font-size: 14px; }
.tw { overflow-x: auto; margin-top: 14px; border: 1px solid var(--line); border-radius: 10px; background: var(--panel); }
table { border-collapse: collapse; font-size: 14px; min-width: 100%; }
th, td { border: 1px solid var(--grid); padding: 0; text-align: center; height: 34px; }
thead th { background: var(--panel); position: sticky; top: 0; z-index: 2; padding: 4px 8px; font-weight: 500; white-space: nowrap; }
thead .who th { font-weight: 700; }
th.date, td.date { position: sticky; left: 0; background: var(--panel); z-index: 1; text-align: right; padding: 0 8px; font-family: var(--mono); font-size: 13px; white-space: nowrap; min-width: 108px; }
thead th.date { z-index: 3; }
td.dow { width: 30px; font-size: 13px; }
tr.sat td { background: var(--sat); } tr.sun td { background: var(--sun); } tr.sun td.dow, tr.sun td.date { color: var(--sunInk); }
tr.sat td.date { background: var(--sat); } tr.sun td.date { background: var(--sun); }
tr.today td.date { background: var(--today); font-weight: 700; text-decoration: underline; }
tr.wk td { background: var(--week); color: var(--onWeek); height: 26px; text-align: left; padding: 0 10px; font-size: 12px; font-weight: 700; }
td.c { min-width: 74px; }
td.c.off { background: var(--off); }
tr.sat td.c.off, tr.sun td.c.off { opacity: .75; }
.cb { width: 24px; height: 24px; border: 2px solid var(--ink); border-radius: 5px; display: inline-grid; place-items: center; background: var(--panel); vertical-align: middle; padding: 0; }
.cb.on { background: var(--ink); color: var(--panel); }
.cb.on::after { content: "✓"; font-weight: 700; font-size: 16px; line-height: 1; }
.cb.ro { border-color: var(--muted); cursor: default; } .cb.ro.on { background: var(--muted); }
.cb.dot { border-style: dashed; opacity: .45; }
.cb.dot.on { opacity: 1; border-style: solid; }
tfoot td { font-family: var(--mono); font-size: 13px; padding: 4px 6px; background: var(--panel); }
tfoot td.date { font-family: var(--sans); }
.pct { font-weight: 700; }
th.mine { box-shadow: inset 0 -3px 0 var(--acc); }
.form .h { border: 1px solid var(--grid); border-radius: 10px; padding: 10px; margin-top: 8px; display: grid; gap: 8px; }
.chips { display: flex; gap: 4px; flex-wrap: wrap; }
.chips button { padding: 4px 10px; border-radius: 16px; font-size: 13px; }
.chips button.on { background: var(--acc); color: var(--accInk); border-color: var(--acc); }
label { font-size: 12px; color: var(--muted); }
.note { font-size: 12px; color: var(--muted); }
.mini { padding: 3px 8px; font-size: 12px; }
.toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 9px 14px; border-radius: 10px; font-size: 14px; z-index: 9; max-width: 90vw; }
.list a { display: block; padding: 10px; border: 1px solid var(--grid); border-radius: 10px; margin-top: 6px; text-decoration: none; }
.pname { font-weight: 700; border-color: transparent; background: transparent; }
.pname:hover { border-color: var(--line); }
.dash .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 8px; margin-top: 10px; }
.dash .kpis div { background: var(--bg); border-radius: 10px; padding: 8px 12px; }
.dash .kpis b { display: block; font-family: var(--mono); font-size: 22px; }
.dash .kpis small { font-size: 13px; color: var(--muted); }
.dash .board { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px; margin-top: 12px; }
.dash .pc { border: 1px solid var(--grid); border-radius: 10px; padding: 10px 12px; }
.dash .bar { height: 8px; border-radius: 4px; background: var(--grid); overflow: hidden; margin: 6px 0; }
.dash .bar i { display: block; height: 100%; background: var(--acc); }
.dash .hl { display: flex; justify-content: space-between; gap: 8px; font-size: 13px; }
.dash .chips button { font-size: 12px; padding: 3px 10px; }
.dash .mrow { display: flex; gap: 10px; margin-top: 12px; overflow-x: auto; padding-bottom: 4px; }
.dash .mrow > div { display: grid; justify-items: center; gap: 4px; flex: none; }
.dash .mb { width: 34px; height: 60px; border-radius: 6px; background: var(--grid); display: flex; align-items: flex-end; overflow: hidden; }
.dash .mb i { display: block; width: 100%; background: var(--acc); }
.pot .potv { font-family: var(--mono); font-size: 28px; font-weight: 700; }
.pot .potv small { font-size: 14px; margin-left: 2px; }
.dash .st { display: block; margin-top: 16px; font-size: 14px; }
.dash .dgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 0 18px; }
.dash .hrank { display: grid; gap: 4px; margin-top: 8px; }
.dash .hrank > div { display: grid; grid-template-columns: 26px minmax(0, 1fr) auto 52px; gap: 8px; align-items: center; padding: 6px 8px; border-radius: 8px; background: var(--bg); font-size: 14px; }
.dash .hrank .no { font-family: var(--mono); color: var(--muted); }
.dash .hrank .pct { text-align: right; }
th.unpaid { background: var(--off); }
.paybox { display: flex; gap: 4px; justify-content: center; flex-wrap: wrap; margin-top: 2px; }
.badge { font-size: 11px; font-weight: 700; color: var(--sunInk); border: 1px solid var(--sunInk); border-radius: 999px; padding: 0 6px; }
.badge.ok { color: var(--acc); border-color: var(--acc); }
.mini.pay { color: var(--sunInk); border-color: var(--sunInk); font-weight: 700; }
.cb.lock { opacity: .35; }
.payinfo { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: grid; place-items: center; z-index: 20; padding: 16px; }
.payinfo .card { background: var(--panel); color: var(--ink); border-radius: 14px; padding: 18px; width: min(360px, 100%); }
.payinfo .amt { font-family: var(--mono); font-size: 30px; font-weight: 700; margin-top: 8px; }
.payinfo .acct { font-size: 17px; margin: 6px 0 8px; }
.payinfo .acct b { font-family: var(--mono); letter-spacing: .02em; }
.dash .podium { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; margin-top: 8px; align-items: end; }
.dash .pd { display: grid; justify-items: center; gap: 2px; border-radius: 12px; padding: 12px 8px; background: var(--bg); text-align: center; }
.dash .pd.r1 { background: var(--today); padding-block: 18px; }
.dash .pd .m { font-size: 28px; line-height: 1; }
.dash .pd .rk { font-size: 12px; color: var(--muted); font-weight: 700; }
.dash .pd b { font-size: 17px; }
th.unpaid .pname { color: var(--muted); font-weight: 400; }
.wkline { font-family: var(--mono); font-size: 12px; color: var(--muted); font-weight: 400; }
.px { image-rendering: pixelated; vertical-align: middle; flex: none; }
.pname { display: inline-flex; align-items: center; gap: 5px; }
.adm-only[hidden] { display: none; }
</style>
</head>
<body>
<div class="wrap">
  <a class="brand" href="/programs">← AI이현 프로그램</a>
  <h1 id="title">습관 챌린지</h1>
  <div class="sub" id="sub">각자 정한 습관을 매일 체크해요. 주소를 받은 사람만 들어올 수 있어요.</div>

  <!-- 주소 없이 들어온 경우 -->
  <div id="home" hidden>
    <div class="panel" id="noKey">
      <b>초대받은 주소로 들어와 주세요.</b>
      <div class="note">챌린지를 만든 사람이 보내 준 주소(…/programs/habit?g=…)로 열면 바로 참여할 수 있어요.</div>
      <div class="row" style="margin-top:10px"><input type="password" id="keyIn" placeholder="관리 키 (만든 사람만)"><button id="keyGo">확인</button></div>
    </div>
    <div class="panel" id="adm" hidden>
      <b>내 챌린지</b>
      <div class="list" id="glist"></div>
      <div class="row" style="margin-top:10px"><input type="text" id="newTitle" placeholder="새 챌린지 이름 (예: 우리 습관 챌린지)" style="flex:1"><button class="main" id="newGo">만들기</button></div>
    </div>
  </div>

  <!-- 챌린지 -->
  <div id="room" hidden>
    <div class="tabs" id="tabs"></div>
    <div class="panel row me" style="justify-content:space-between">
      <div class="row"><button class="main" id="addP">＋ 사람 추가</button><span class="note">이름을 누르면 그 사람 습관을 고칠 수 있어요</span></div>
      <div class="row"><button id="rename" class="adm-only" hidden>이름 바꾸기</button><button id="delM" class="adm-only" hidden>이 달 삭제</button><button id="share">초대 주소 복사</button></div>
    </div>
    <div class="panel form" id="form" hidden></div>
    <div id="pot" class="panel pot" hidden></div>
    <div id="dash" class="panel dash" hidden></div>
    <div id="empty" class="panel" hidden></div>
    <div class="tw" id="tw"><table id="tb"></table></div>
    <p class="note">점선 칸은 쉬기로 한 날이에요. 그래도 했으면 체크하면 달성에 더해져요. 모두 같은 화면을 보고, 누구 칸이든 체크할 수 있어요.</p>
  </div>
</div>
<script>
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const DOW = ["일", "월", "화", "수", "목", "금", "토"];
const PICK = [1, 2, 3, 4, 5, 6, 0]; // 요일 고르는 순서: 월~일
const pad = (n) => String(n).padStart(2, "0");
const ymd = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const ym = (d) => ymd(d).slice(0, 7);
const today = ymd(new Date());
let toastT; function toast(m) { let el = $(".toast"); if (!el) { el = document.createElement("div"); el.className = "toast"; document.body.append(el); } el.textContent = m; clearTimeout(toastT); toastT = setTimeout(() => el.remove(), 3000); }
const ls = { get(k) { try { return localStorage.getItem(k); } catch { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch {} } };
const Q = new URLSearchParams(location.search), G = Q.get("g");
// 관리 화면은 ?manage=1 로 연 주소에서만. 초대 주소(?g=…)로 열면 관리 키가 있어도 일반 참가자 화면
const MANAGE = !G || Q.get("manage") === "1";
let key = MANAGE ? ls.get("ai-admin-key") || "" : "";
let S = { meta: null, month: null, members: [], checks: {} }, editing = null;

async function api(method, body, q = "") {
  const res = await fetch("/api/habit" + q, { method, headers: { "Content-Type": "application/json", ...(key ? { "x-admin-key": key } : {}) }, body: body ? JSON.stringify(body) : undefined });
  const j = await res.json().catch(() => ({}));
  if (!res.ok) throw Object.assign(new Error(j.error || res.status), { code: j.error, status: res.status });
  return j;
}

// ── 도트 캐릭터: 이름으로 남/여 추측, 색은 사람마다 고정
const FEM_END = "희숙자미은경선연아나화옥순혜린주인란영정애리희서윤";
const FEM_START = "혜미은지서예소다채가유수하나";
const MALE_END = "호철훈준석우범규식환섭태용근원혁성기동진민현빈재열욱택모일길구한";
function guessSex(name) {
  const n = (name || "").replace(/[^가-힣]/g, ""); if (!n) return "m";
  const g = n.length >= 3 ? n.slice(1) : n.length === 2 ? n : n;
  const last = g[g.length - 1], first = g[0];
  let f = 0;
  if (FEM_END.includes(last)) f += 2; if (MALE_END.includes(last)) f -= 2;
  if (g.length >= 2 && FEM_START.includes(first)) f += 1;
  return f > 0 ? "f" : "m";
}
const sexOf = (m) => m.sex || guessSex(m.name);
function hashN(s) { let h = 7; for (const c of String(s)) h = (h * 31 + c.charCodeAt(0)) >>> 0; return h; }
const SPR = {
  m: ["...HHHH...", "..HHHHHH..", ".HHHHHHHH.", ".HSSSSSSH.", ".SSESSESS.", ".SSSSSSSS.", "..SSMMSS..", "...SSSS...", "..CCCCCC..", ".CCCCCCCC.", ".SCCCCCCS.", "..PPPPPP..", "..PP..PP..", "..KK..KK.."],
  f: ["...HHHH...", "..HHHHHHR.", ".HHHHHHHRR", "HHSSSSSSHH", "HSSESSESSH", "HSBSSSSBSH", "HHSSMMSSHH", "HH.SSSS.HH", "H.CCCCCC.H", ".CCCCCCCC.", ".SCCCCCCS.", ".DDDDDDDD.", "...S..S...", "..KK..KK.."],
};
const HAIR = ["#2b1d14", "#4a2f1d", "#6b3f22", "#1c1c2a", "#8a5a2b", "#3b2a4a"], SHIRT = ["#3a7bd5", "#e5484d", "#2fa36b", "#f08a1c", "#8e5bd8", "#1fa3b8", "#d94f8a", "#5b6b7f"], SKIN = ["#f6cfa8", "#efc196", "#e3ae82"];
function rects(rows, pal, u) { let out = ""; rows.forEach((r, y) => [...r].forEach((c, x) => { if (pal[c]) out += `<rect x="${x * u}" y="${y * u}" width="${u}" height="${u}" fill="${pal[c]}"/>`; })); return out; }
function avatar(m, u = 2) {
  const sex = sexOf(m), h = hashN(m.id || m.name), rows = SPR[sex];
  const pal = { H: HAIR[h % HAIR.length], S: SKIN[(h >> 3) % SKIN.length], E: "#222", M: "#c4554d", B: "#f59ab0", R: "#e5484d", C: SHIRT[(h >> 5) % SHIRT.length], P: "#3b4a6b", D: SHIRT[(h >> 8) % SHIRT.length], K: "#333" };
  return `<svg class="px" width="${10 * u}" height="${14 * u}" viewBox="0 0 ${10 * u} ${14 * u}" shape-rendering="crispEdges" aria-hidden="true">${rects(rows, pal, u)}</svg>`;
}
// ── 할일 도트 아이콘: 습관 이름의 낱말로 고름
const ICONS = {
  dumbbell: [/헬스|근력|스쿼트|푸시업|팔굽|플랭크|홈트|운동|웨이트|복근/, ["........", ".G....G.", "GG....GG", "GGGGGGGG", "GG....GG", ".G....G.", "........", "........"]],
  shoe: [/러닝|달리|걷|산책|만보|등산|조깅|계단|자전거|마라톤/, ["........", "..RR....", "..RRR...", "..RRRR..", ".RRRRRRR", ".WWWWWWW", "........", "........"]],
  book: [/독서|책|필사|읽|낭독|오디오북/, [".BBBBBB.", ".BWWWWB.", ".BWBBWB.", ".BWWWWB.", ".BWBBWB.", ".BWWWWB.", ".BBBBBB.", "........"]],
  drop: [/물|수분|차 마시/, ["...BB...", "...BB...", "..BBBB..", ".BBBBBB.", ".BWBBBB.", ".BWBBBB.", "..BBBB..", "........"]],
  sun: [/기상|아침|일찍 일|미라클|햇빛|새벽/, ["Y..YY..Y", ".Y....Y.", "..OOOO..", "YOOOOOOY", "YOOOOOOY", "..OOOO..", ".Y....Y.", "Y..YY..Y"]],
  moon: [/수면|잠|취침|자기|숙면/, ["...YYY..", "..YYY...", ".YYY....", ".YYY....", ".YYY....", ".YYYY...", "..YYYYY.", "...YYY.."]],
  apple: [/식단|다이어트|채소|과일|샐러드|단식|간헐|야식|건강식|영양제|비타민|약/, ["....L...", "...L....", ".RR.RR..", "RRRRRRR.", "RWRRRRR.", "RRRRRRR.", ".RRRRR..", "..R.R..."]],
  coin: [/저축|돈|가계부|투자|주식|절약|무지출|재테크|부동산|경제/, ["..YYYY..", ".YYYYYY.", "YYYOOYYY", "YYYOOYYY", "YYYOOYYY", "YYYOOYYY", ".YYYYYY.", "..YYYY.."]],
  pencil: [/공부|글|일기|블로그|계획|기록|영어|강의|메모|단어|자격증|코딩|하루/, ["......PP", ".....YPP", "....YYY.", "...YYY..", "..YYY...", ".WYY....", ".KW.....", "........"]],
  heart: [/명상|기도|감사|마음|요가|스트레칭|가족|연락|칭찬|필라테스|호흡/, ["........", ".RR..RR.", "RRRRRRRR", "RWRRRRRR", "RRRRRRRR", ".RRRRRR.", "..RRRR..", "...RR..."]],
  no: [/금연|금주|술|담배|폰|유튜브|SNS|sns|게임|디지털|커피/, ["..RRRR..", ".R....R.", "R.R....R", "R..R...R", "R...R..R", "R....R.R", ".R....R.", "..RRRR.."]],
  star: [/./, ["...YY...", "...YY...", "YYYYYYYY", ".YYYYYY.", "..YYYY..", ".YYYYYY.", ".YY..YY.", "Y......Y"]],
};
const IPAL = { G: "#6b7a8f", R: "#e5484d", W: "#ffffff", B: "#3a7bd5", Y: "#f5c518", O: "#f08a1c", L: "#3fae49", P: "#f39ab0", K: "#333" };
function hicon(name, u = 2) {
  const [, rows] = Object.values(ICONS).find(([re]) => re.test(name || "")) || ICONS.star;
  return `<svg class="px" width="${8 * u}" height="${8 * u}" viewBox="0 0 ${8 * u} ${8 * u}" shape-rendering="crispEdges" aria-hidden="true">${rects(rows, IPAL, u)}</svg>`;
}

// ── 주소 없이: 만든 사람은 목록·새로 만들기

  table(); ALL = null; dash();
  try { await api("POST", { g: G, month: S.month, op: "check", hid: b.dataset.h, date: b.dataset.d, on }); }
  catch (err) { if (on) delete S.checks[f]; else S.checks[f] = "1"; table(); dash(); toast(err.code === "unpaid" ? "참가비 입금이 확인되면 체크할 수 있어요" : "저장 못 했어요. 다시 눌러 주세요."); }
});

// ── 참가비 안내
function payInfo() {
  const pi = S.meta.payInfo || {};
  let el = $("#payInfo");
  if (!el) { el = document.createElement("div"); el.id = "payInfo"; el.className = "payinfo"; document.body.append(el); }
  el.hidden = false;
  el.innerHTML = `<div class="card"><b>참가비 입금 안내</b>
    ${pi.account ? `<div class="amt">${(pi.fee || 0).toLocaleString("ko-KR")}원</div>
    <div class="acct"><span>${esc(pi.bank)}</span> <b>${esc(pi.account)}</b></div>` : '<div class="note" style="margin-top:8px">아직 입금 계좌가 정해지지 않았어요. 챌린지를 만든 사람에게 물어봐 주세요.</div>'}
    <div class="note">입금하고 나면 관리자가 확인해 승인해요. 승인되면 내 칸을 체크할 수 있어요.</div>
    <div class="row" style="margin-top:12px;justify-content:flex-end">${pi.account ? '<button id="payCopy">계좌번호 복사</button>' : ""}<button class="main" id="payClose">닫기</button></div></div>`;
}
document.addEventListener("click", async (e) => {
  if (e.target.id === "payClose" || e.target.id === "payInfo") $("#payInfo").hidden = true;
  if (e.target.id === "payCopy") { try { await navigator.clipboard.writeText(S.meta.payInfo.account); toast("계좌번호를 복사했어요"); } catch { prompt("계좌번호", S.meta.payInfo.account); } }
});
$("#tabs").addEventListener("click", async (e) => {
  const b = e.target.closest("button"); if (!b) return;
  if (b.dataset.all) { dashMode = "all"; return render(); }
  if (b.dataset.m) { dashMode = "month"; return load(b.dataset.m); }
  if (b.dataset.add) {
    const from = S.meta.months[S.meta.months.length - 1];
    try { await api("POST", { g: G, month: b.dataset.add, op: "addMonth", copyFrom: from }); toast(from ? "지난달 사람·습관을 그대로 가져왔어요" : "새 달을 만들었어요"); load(b.dataset.add); }
    catch { toast("만들지 못했어요"); }
  }
});
$("#addP").onclick = () => { if (!S.month) return toast("먼저 달을 만들어 주세요"); openForm({ name: "", habits: [{ name: "", perWeek: 3, days: [] }] }); };
$("#rename").onclick = async () => {
  const t = (prompt("챌린지 이름", S.meta.title) || "").trim(); if (!t || t === S.meta.title) return;
  try { await api("POST", { g: G, op: "title", title: t }); toast("이름을 바꿨어요"); load(S.month); } catch { toast("못 바꿨어요"); }
};
$("#delM").onclick = async () => {
  const b = $("#delM");
  if (b.dataset.sure !== "1") { b.dataset.sure = "1"; b.textContent = `${+S.month.slice(5)}월 기록까지 지워요. 한 번 더`; return; }
  try { await api("POST", { g: G, month: S.month, op: "delMonth" }); toast("그 달을 지웠어요"); dashMode = "month"; load(); } catch { toast("못 지웠어요"); }
};
$("#share").onclick = async () => { const u = location.origin + location.pathname + "?g=" + G; try { await navigator.clipboard.writeText(u); toast("초대 주소를 복사했어요"); } catch { prompt("이 주소를 보내 주세요", u); } };

// ── 내 습관 설정: 이름, 습관 여러 개, 주 n회 또는 요일
function openForm(m) {
  editing = m; const F = $("#form"); F.hidden = false;
  F.innerHTML = `<div class="row" style="justify-content:space-between"><b>${m.id ? esc(m.name) + " 습관 고치기" : "사람 추가"}</b><span class="note">${+S.month.slice(5)}월부터 적용돼요</span></div>
    <div class="row" style="margin-top:8px"><label>이름</label><input type="text" id="fName" value="${esc(m.name)}" placeholder="예: 이현규" maxlength="20"></div>
    <div class="row"><label>캐릭터</label><span id="fAva">${avatar({ ...m, name: m.name }, 3)}</span><div class="chips">${[["m", "남"], ["f", "여"]].map(([k, t]) => `<button data-sex="${k}" class="${sexOf(m) === k ? "on" : ""}">${t}</button>`).join("")}</div><span class="note">이름으로 골라 뒀어요. 틀리면 바꿔 주세요</span></div>
    ${m.habits.map((h, i) => `<div class="h" data-i="${i}">
      <div class="row"><input type="text" data-k="name" value="${esc(h.name)}" placeholder="습관 (예: 하루계획, 필사)" maxlength="30" style="flex:1"><button class="mini" data-del="${i}">빼기</button></div>
      <div class="row"><label>요일 (고르면 그 요일만)</label><div class="chips">${PICK.map((d) => `<button data-day="${d}" class="${h.days.includes(d) ? "on" : ""}">${DOW[d]}</button>`).join("")}</div></div>
      <div class="row"><label>요일 없이 주</label><select data-k="perWeek" ${h.days.length ? "disabled" : ""}>${[1, 2, 3, 4, 5, 6, 7].map((n) => `<option ${n === (h.days.length || h.perWeek) ? "selected" : ""}>${n}</option>`).join("")}</select><label>회</label></div>
    </div>`).join("")}
    <div class="row" style="margin-top:10px;justify-content:space-between"><div class="row"><button id="fAdd">＋ 습관 더하기</button>${m.id ? '<button id="fLeave">이 달에서 빼기</button>' : ""}</div><div class="row"><button id="fCancel">닫기</button><button class="main" id="fSave">저장</button></div></div>`;
  F.scrollIntoView({ behavior: "smooth", block: "center" });
}
function readForm() { editing.name = $("#fName").value.trim(); document.querySelectorAll("#form .h").forEach((el) => { const h = editing.habits[+el.dataset.i]; h.name = el.querySelector('[data-k="name"]').value.trim(); h.perWeek = +el.querySelector('[data-k="perWeek"]').value; }); }
$("#form").addEventListener("click", async (e) => {
  const t = e.target.closest("button"); if (!t) return;
  if (t.dataset.day) { readForm(); const h = editing.habits[+t.closest(".h").dataset.i], d = +t.dataset.day; h.days = h.days.includes(d) ? h.days.filter((x) => x !== d) : [...h.days, d]; if (h.days.length) h.perWeek = h.days.length; return openForm(editing); }
  if (t.dataset.sex) { readForm(); editing.sex = t.dataset.sex; return openForm(editing); }
  if (t.dataset.del) { readForm(); editing.habits.splice(+t.dataset.del, 1); return openForm(editing); }
  if (t.id === "fAdd") { readForm(); if (editing.habits.length >= 6) return toast("습관은 6개까지예요"); editing.habits.push({ name: "", perWeek: 3, days: [] }); return openForm(editing); }
  if (t.id === "fCancel") { $("#form").hidden = true; return; }
  if (t.id === "fLeave") { if (t.dataset.sure !== "1") { t.dataset.sure = "1"; t.textContent = "정말 뺄까요? 한 번 더"; return; } try { await api("POST", { g: G, month: S.month, op: "delMember", id: editing.id }); $("#form").hidden = true; load(S.month); } catch { toast("못 뺐어요"); } return; }
  if (t.id === "fSave") {
    readForm(); editing.habits = editing.habits.filter((h) => h.name);
    if (!editing.name) return toast("이름을 써 주세요"); if (!editing.habits.length) return toast("습관을 하나 이상 써 주세요");
    if (!editing.id && S.members.some((m) => m.name === editing.name)) return toast("같은 이름이 있어요. 표에서 그 이름을 눌러 고쳐 주세요.");
    t.disabled = true;
    try { await api("POST", { g: G, month: S.month, op: "saveMember", member: editing }); $("#form").hidden = true; toast("저장했어요"); load(S.month); }
    catch { toast("저장 못 했어요"); t.disabled = false; }
  }
});

if (G) load().then(() => document.getElementById("todayRow")?.scrollIntoView({ block: "center" })); else home();
</script>
</body>
</html>
