<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="/favicon.svg">
<title>엄마 일기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap">
<style>
/* 가족 앨범처럼: 크림 종이 + 연분홍. 가족 유튜브 → 일정 → 버킷리스트 → (맨 밑) 병원 일정: 없으면 작게 접힘, 있으면 펼쳐서 달력 */
:root {
  --bg: #faf6ef; --panel: #fffdf9; --ink: #2b2522; --muted: #7a6f68; --line: #eadfd3; --soft: #f3ebe0;
  --rose: #c8566b; --roseInk: #ffffff; --roseSoft: #f8e4e6; --sage: #5f8a6b; --sageSoft: #e6efe7; --danger: #b23a3a;
  --serif: "Gowun Batang", "Nanum Myeongjo", "AppleMyungjo", serif;
  --sans: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1b1817; --panel: #242020; --ink: #f1e9e2; --muted: #b0a49b; --line: #3a3330; --soft: #2c2726;
    --rose: #e6879a; --roseInk: #1b1817; --roseSoft: #3a2629; --sage: #8fbf9c; --sageSoft: #243029; --danger: #ff8a80; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #1b1817; --panel: #242020; --ink: #f1e9e2; --muted: #b0a49b; --line: #3a3330; --soft: #2c2726;
  --rose: #e6879a; --roseInk: #1b1817; --roseSoft: #3a2629; --sage: #8fbf9c; --sageSoft: #243029; --danger: #ff8a80; color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--sans); font-size: 16px; line-height: 1.6; }
.wrap { max-width: 960px; margin: 0 auto; padding: 22px max(16px, env(safe-area-inset-right)) 70px max(16px, env(safe-area-inset-left)); }
h1 { font-family: var(--serif); font-size: 34px; margin: 0; letter-spacing: -.01em; }
h2 { font-family: var(--serif); font-size: 22px; margin: 0; }
.sub { color: var(--muted); font-size: 14px; margin-top: 2px; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.between { justify-content: space-between; }
section { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 18px; margin-top: 18px; }
button, input, textarea { font: inherit; color: var(--ink); }
button { cursor: pointer; border: 1px solid var(--line); background: var(--panel); border-radius: 10px; padding: 7px 13px; font-size: 14px; }
button.main { background: var(--rose); border-color: var(--rose); color: var(--roseInk); font-weight: 700; }
button.ghost { border-color: transparent; background: transparent; color: var(--muted); padding: 4px 8px; font-size: 13px; }
button.warn { color: var(--danger); border-color: var(--danger); }
button:disabled { opacity: .5; cursor: default; }
input, textarea { background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 8px 11px; min-width: 0; width: 100%; }
textarea { min-height: 70px; resize: vertical; }
label { display: grid; gap: 3px; font-size: 13px; color: var(--muted); }
.form { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); background: var(--soft); border-radius: 12px; padding: 14px; margin-top: 12px; }
.form .full { grid-column: 1 / -1; }
.empty { color: var(--muted); font-size: 14px; padding: 10px 0 2px; }
.items { list-style: none; margin: 12px 0 0; padding: 0; display: grid; gap: 8px; }
.it { display: flex; gap: 12px; align-items: flex-start; padding: 12px; border: 1px solid var(--line); border-radius: 12px; }
.it .body { flex: 1; min-width: 0; }
.it .t { font-weight: 700; }
.it .m { color: var(--muted); font-size: 14px; white-space: pre-wrap; overflow-wrap: anywhere; }
.when { flex: none; width: 64px; text-align: center; border-radius: 10px; background: var(--roseSoft); padding: 6px 0; line-height: 1.2; }
.when b { display: block; font-family: var(--serif); font-size: 22px; }
.when span { font-size: 12px; color: var(--muted); }
.when.past { background: var(--soft); }
.dday { font-size: 12px; font-weight: 700; color: var(--rose); margin-left: 6px; }
.tools { display: flex; gap: 2px; flex: none; }
.chk { flex: none; width: 28px; height: 28px; border-radius: 50%; border: 2px solid var(--sage); background: var(--panel); display: grid; place-items: center; padding: 0; }
.chk.on { background: var(--sage); color: var(--panel); }
.chk.on::after { content: "✓"; font-weight: 700; }
.chk.ro { cursor: default; }
.it.done .t { color: var(--muted); text-decoration: line-through; text-decoration-color: var(--sage); }
.donedate { font-size: 13px; color: var(--sage); font-weight: 700; }
.trip { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 18px; margin-top: 12px; align-items: start; }
@media (max-width: 760px) { .trip { grid-template-columns: minmax(0, 1fr); } }
.mapbox { background: var(--soft); border-radius: 14px; padding: 8px; min-width: 0; }
.kwrap { position: relative; }
.kmap { display: block; width: 100%; height: auto; aspect-ratio: 546 / 565; max-width: 100%; touch-action: pan-y; user-select: none; -webkit-user-select: none; cursor: grab; }
.kmap.zoomed { touch-action: none; }
.kmap .rg { fill: var(--panel); stroke: var(--line); stroke-width: .6px; vector-effect: non-scaling-stroke; cursor: pointer; transition: fill .15s; }
.kmap .rg:hover { fill: var(--roseSoft); }
.kmap .rg.went { fill: color-mix(in srgb, var(--rose) calc(30% + var(--lv) * 14%), var(--panel)); }
.kmap .rg.sel { stroke: var(--ink); stroke-width: 2px; }
.kmap .pv path { fill: none; stroke: var(--muted); stroke-width: 1.1px; vector-effect: non-scaling-stroke; pointer-events: none; opacity: .55; }
.kmap .dong path { fill: none; stroke: var(--line); stroke-width: .5px; vector-effect: non-scaling-stroke; pointer-events: none; }
.kmap:not(.dongs) .dong { display: none; }
.kmap .inset { fill: none; stroke: var(--muted); stroke-dasharray: 3 3; stroke-width: .8px; vector-effect: non-scaling-stroke; opacity: .6; pointer-events: none; }
.kmap text { text-anchor: middle; dominant-baseline: middle; pointer-events: none; paint-order: stroke; stroke: var(--soft); stroke-linejoin: round; font-family: var(--sans); }
.kmap .lp { font-size: 13px; font-weight: 700; fill: var(--muted); stroke-width: 3px; }
.kmap .lr { font-size: calc(12px / var(--z)); font-weight: 700; fill: var(--muted); stroke-width: calc(2.6px / var(--z)); }
.kmap .lr.on { fill: var(--ink); }
.kmap .ld { font-size: calc(10px / var(--z)); fill: var(--muted); opacity: .85; stroke-width: calc(2px / var(--z)); }
.kmap .spot { cursor: pointer; }
.kmap .li { font-size: calc(9px / var(--z)); fill: var(--muted); text-anchor: start; dominant-baseline: hanging; stroke-width: 0; }
.kmap .spot circle { r: calc(2.6px / var(--z) * 1.6); fill: var(--panel); stroke: var(--sage); stroke-width: 1.4px; vector-effect: non-scaling-stroke; }
.kmap .spot.went circle { fill: var(--rose); stroke: var(--panel); }
.kmap .spot text { font-size: calc(9px / var(--z) * 1.3); font-weight: 700; fill: var(--sage); stroke-width: calc(2.4px / var(--z)); dominant-baseline: auto; transform: translateY(calc(-5px / var(--z) * 1.3)); }
.kmap .spot.went text { fill: var(--rose); }
.kmap.far .spot:not(.went) text { display: none; }
.kmap .spot.hl circle { stroke: var(--ink); stroke-width: 2.4px; }
.zbar { position: absolute; right: 6px; bottom: 6px; display: flex; flex-direction: column; gap: 4px; }
.zbar button { width: 34px; height: 34px; padding: 0; border-radius: 10px; font-size: 17px; font-weight: 700; background: var(--panel); color: var(--ink); border: 1px solid var(--line); }
.maphint { font-size: 12px; color: var(--muted); margin-top: 6px; display: flex; gap: 12px; flex-wrap: wrap; }
.maphint i { display: inline-block; width: 9px; height: 9px; border-radius: 50%; vertical-align: -1px; margin-right: 4px; border: 1.5px solid var(--sage); }
.maphint i.on { background: var(--rose); border-color: var(--rose); }
.ftabs { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 12px; }
.ftabs button { border-radius: 999px; padding: 6px 13px; font-size: 14px; background: var(--soft); color: var(--muted); border: 1px solid var(--line); font-weight: 700; }
.ftabs button.on { background: var(--rose); color: var(--roseInk); border-color: var(--rose); }
.ftabs button small { font-weight: 500; opacity: .8; margin-left: 3px; }
.fests { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 240px), 1fr)); gap: 12px; margin-top: 12px; }
.fest { display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; background: var(--panel); color: inherit; text-decoration: none; min-width: 0; }
.fest .ph { aspect-ratio: 16 / 10; max-width: 100%; background: var(--soft) center / cover no-repeat; position: relative; }
.fest .ph b { position: absolute; left: 8px; top: 8px; font-size: 12px; border-radius: 999px; padding: 2px 9px; background: var(--rose); color: var(--roseInk); }
.fest .ph b.now { background: var(--sage); color: var(--panel); }
.fest .tx { padding: 9px 11px 11px; display: grid; gap: 3px; }
.fest .tx .t { font-weight: 700; }
.fest .tx .m { font-size: 13px; color: var(--muted); }
.ttabs { display: flex; gap: 4px; margin-top: 8px; border-bottom: 1px solid var(--line); }
.ttabs button { border: 0; border-radius: 0; background: none; padding: 6px 12px; font-weight: 700; color: var(--muted); border-bottom: 2px solid transparent; margin-bottom: -1px; }
.ttabs button.on { color: var(--rose); border-bottom-color: var(--rose); }
.stype { display: flex; flex-wrap: wrap; gap: 5px; margin: 10px 0 4px; }
.stype button { font-size: 12px; padding: 3px 10px; border-radius: 999px; }
.stype button.on { background: var(--ink); color: var(--panel); border-color: var(--ink); }
.slist { list-style: none; margin: 6px 0 0; padding: 0; display: grid; gap: 4px; }
.slist button { width: 100%; display: grid; grid-template-columns: auto auto minmax(0, 1fr); align-items: center; gap: 8px; text-align: left; padding: 8px 10px; border-radius: 10px; background: var(--panel); border: 1px solid var(--line); color: var(--ink); font-weight: 400; }
.slist button i { width: 10px; height: 10px; border-radius: 50%; border: 1.5px solid var(--sage); }
.slist button.went i { background: var(--rose); border-color: var(--rose); }
.slist button.on { border-color: var(--ink); }
.slist button span { font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; text-align: right; }
.pager { display: flex; flex-wrap: wrap; gap: 4px; justify-content: center; margin-top: 12px; }
.pager button { min-width: 34px; height: 34px; padding: 0 8px; border-radius: 10px; font-weight: 700; }
.pager button.on { background: var(--rose); color: var(--roseInk); border-color: var(--rose); }
.fam { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0 4px; }
.fam span, .fam button { font-size: 13px; border-radius: 999px; padding: 4px 11px; background: var(--sageSoft); color: var(--sage); border: 0; font-weight: 700; }
.fam button.went, .fam span.went { background: var(--roseSoft); color: var(--rose); }
.fam .lbl { background: none; padding: 4px 0; color: var(--muted); font-weight: 500; }
.rtag { flex: none; font-size: 12px; font-weight: 700; color: var(--rose); background: var(--roseSoft); border-radius: 999px; padding: 2px 9px; margin-top: 2px; }
select { font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 8px 11px; }
.count { font-size: 14px; color: var(--sage); font-weight: 700; }
.bar { height: 6px; border-radius: 3px; background: var(--sageSoft); overflow: hidden; margin-top: 8px; }
.bar i { display: block; height: 100%; background: var(--sage); }
.vids { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; margin-top: 12px; }
@media (max-width: 600px) { .vids { grid-template-columns: minmax(0, 1fr); } }
.vtl { position: relative; margin-top: 14px; padding-left: 22px; }
.vtl::before { content: ""; position: absolute; left: 6px; top: 8px; bottom: 8px; width: 2px; background: var(--line); }
.vtl-g + .vtl-g { margin-top: 22px; }
.vtl-d { position: relative; font-family: var(--serif); font-weight: 700; font-size: 17px; }
.vtl-d::before { content: ""; position: absolute; left: -21px; top: 50%; width: 12px; height: 12px; margin-top: -6px; border-radius: 50%; background: var(--rose); border: 2px solid var(--panel); }
.vtl .vids { margin-top: 8px; }
.vid { border: 1px solid var(--line); border-radius: 12px; overflow: hidden; background: var(--panel); min-width: 0; }
.frame { position: relative; aspect-ratio: 16 / 9; max-width: 100%; background: #000; }
.frame iframe, .frame button { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
.frame button { padding: 0; border-radius: 0; background: #000 center / cover no-repeat; }
.frame button::after { content: "▶"; position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 60px; height: 42px; border-radius: 12px; background: rgba(200, 40, 40, .92); color: #fff; font-size: 20px; display: grid; place-items: center; }
.vid .cap { padding: 10px 12px; display: flex; gap: 8px; align-items: flex-start; }
.vid .cap .body { flex: 1; min-width: 0; }
details.health { background: var(--panel); border: 1px dashed var(--line); border-radius: 16px; margin-top: 30px; }
details.health > summary { cursor: pointer; padding: 14px 18px; color: var(--muted); font-size: 15px; list-style: none; }
details.health > summary::-webkit-details-marker { display: none; }
details.health > summary::before { content: "▸ "; }
details.health[open] > summary::before { content: "▾ "; }
details.health .in { padding: 0 18px 18px; }
details.health.has { border-style: solid; }
details.health.has > summary { color: var(--ink); font-family: var(--serif); font-size: 22px; padding: 18px; }
.cal { margin-top: 12px; }
.cal .nav { display: flex; align-items: center; justify-content: center; gap: 14px; font-family: var(--serif); font-size: 18px; }
.cal .grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; margin-top: 8px; }
.cal .dw { text-align: center; font-size: 12px; color: var(--muted); }
.cal .dw:first-child, .cal .day.sun .n { color: var(--danger); }
.cal .day { min-height: 58px; border: 1px solid var(--line); border-radius: 8px; padding: 3px 4px; font-size: 12px; min-width: 0; }
.cal .day.blank { border-color: transparent; }
.cal .day.today { outline: 2px solid var(--ink); outline-offset: -2px; }
.cal .day.on { background: var(--roseSoft); border-color: var(--rose); }
.cal .day .n { font-weight: 700; }
.cal .nav button { font-size: 22px; padding: 2px 12px; }
@media (max-width: 600px) { .cal .day .tm { display: none; } .cal .day .ev { font-size: 11px; } }
.cal .day .ev { display: block; color: var(--rose); font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.past-toggle { margin-top: 8px; }
.adminbar { background: var(--soft); border-radius: 12px; padding: 10px 12px; margin-top: 14px; font-size: 14px; }
.gate { max-width: 420px; }
.toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 9px 14px; border-radius: 10px; font-size: 14px; z-index: 9; max-width: 90vw; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>엄마 일기</h1>
    <div class="sub">가족 영상과 엄마의 일정, 하고 싶은 것을 모아 두는 곳</div>
  </header>

  <div id="gate" class="gate" hidden>
    <section>
      <h2>들어가기</h2>
      <p class="sub">가족은 이현님이 보내준 주소로 들어와요. 이현님은 관리자 키를 넣어 주세요.</p>
      <form id="gateForm" class="row" style="margin-top:10px">
        <input id="gateKey" type="password" placeholder="관리자 키" autocomplete="current-password" style="flex:1">
        <button class="main">들어가기</button>
      </form>
      <div id="gateMsg" class="sub"></div>
    </section>
  </div>

  <div id="app" hidden>
    <div id="adminbar" class="adminbar row between" hidden>
      <span>이현님 화면이에요. 가족은 공유 주소로 보기만 할 수 있어요.</span>
      <span class="row">
        <button id="copyLink">가족 공유 주소 복사</button>
        <button id="newKey" class="ghost">주소 바꾸기</button>
      </span>
    </div>
    <div id="main"></div>
    <details class="health" id="healthBox">
      <summary>병원 일정</summary>
      <div class="in" id="health"></div>
    </details>
  </div>
</div>
<div class="toast" id="toast" hidden></div>

<script src="/programs/mom/map.js"></script>
<script>
const API = '/api/mom';
const q = new URLSearchParams(location.search);
const viewKey = q.get('k') || '';
let adminKey = '';
try { adminKey = localStorage.getItem('ai-admin-key') || ''; } catch {}
let items = [], admin = false, shareKey = '';
const open = { per: 6, sper: 10, form: null, edit: null, past: false, del: null, cal: '', healthTouched: false, sel: '' };
let kmap = null, mapEl = null;

const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const today = () => new Date(Date.now() + 9 * 3600e3).toISOString().slice(0, 10);
const DOW = ['일', '월', '화', '수', '목', '금', '토'];
function toast(t) { const el = $('#toast'); el.textContent = t; el.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => (el.hidden = true), 2200); }
function dday(d) {
  const n = Math.round((Date.parse(d) - Date.parse(today())) / 864e5);
  return n === 0 ? '오늘' : n > 0 ? `D-${n}` : '';
}
function whenBox(d, past) {
  if (!d) return `<div class="when${past ? ' past' : ''}"><b>·</b><span>날짜 미정</span></div>`;
  const [y, m, dd] = d.split('-').map(Number);
  return `<div class="when${past ? ' past' : ''}"><b>${dd}</b><span>${m}월 (${DOW[new Date(y, m - 1, dd).getDay()]})</span></div>`;
}

async function api(method, body, qs = '') {
  const h = { 'Content-Type': 'application/json' };
  if (adminKey) h['x-admin-key'] = adminKey;
  const r = await fetch(API + qs, { method, headers: h, body: body ? JSON.stringify(body) : undefined });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw Object.assign(new Error(j.error || r.status), { code: j.error, status: r.status });
  return j;
}

async function load() {
  try {
    const j = await api('GET', null, viewKey ? `?k=${encodeURIComponent(viewKey)}` : '');
    items = j.items; admin = j.admin; shareKey = j.key || '';
    $('#gate').hidden = true; $('#app').hidden = false; $('#adminbar').hidden = !admin;
    render();
  } catch (e) {
    $('#app').hidden = true; $('#gate').hidden = false;
    if (e.code === 'no_redis') $('#gateMsg').textContent = '저장소가 아직 연결되지 않았어요.';
    else if (viewKey) $('#gateMsg').textContent = '주소가 바뀌었거나 맞지 않아요. 이현님께 새 주소를 받아 주세요.';
    else if (adminKey) $('#gateMsg').textContent = '관리자 키가 맞지 않아요.';
  }
}

// ── 섹션별 입력 칸
const FIELDS = {
  trip: [['region', '지역', 'region'], ['title', '간 곳', 'text', '예: 화담숲 단풍 구경'], ['date', '다녀온 날', 'date'], ['memo', '메모', 'area']],
  sched: [['title', '무엇', 'text', '예: 가족 여행, 동창 모임'], ['date', '날짜', 'date'], ['time', '시간', 'time'], ['place', '장소', 'text'], ['memo', '메모', 'area']],
  bucket: [['title', '하고 싶은 것', 'text', '예: 제주도 한 달 살기'], ['doneOn', '이룬 날 (넣으면 이룸으로 체크)', 'date'], ['memo', '메모', 'area']],
  video: [['url', '유튜브 주소', 'text', 'https://youtu.be/…'], ['title', '제목 (비우면 유튜브 제목)', 'text'], ['date', '찍은 날', 'date'], ['memo', '메모', 'area']],
  health: [['title', '무엇', 'text', '예: 정기 검진, 혈압약'], ['date', '날짜', 'date'], ['time', '시간', 'time'], ['place', '병원', 'text'], ['memo', '메모 (결과·약·주의할 점)', 'area']],
};
function formHtml(sec, it = {}) {

  const vcard = (it) => open.edit === it.id ? `<div class="vid">${formHtml('video', it)}</div>` : `<div class="vid">
      <div class="frame" data-vid="${esc(it.vid)}"><button style="background-image:url('https://i.ytimg.com/vi/${esc(it.vid)}/hqdefault.jpg')" data-play="${esc(it.vid)}" aria-label="재생"></button></div>
      <div class="cap"><div class="body"><div class="t">${esc(it.title || '영상')}</div>${it.memo ? `<div class="m">${esc(it.memo)}</div>` : ''}</div>${tools(it)}</div></div>`;
  const groups = []; vl.forEach((it) => { const d = vday(it); const g = groups[groups.length - 1]; g && g.d === d ? g.l.push(it) : groups.push({ d, l: [it] }); });
  const dlabel = (d) => { const [y, m, dd] = d.split('-').map(Number); return `${y}.${String(m).padStart(2, '0')}.${String(dd).padStart(2, '0')} (${DOW[new Date(y, m - 1, dd).getDay()]})`; };
  const video = `<section><div class="row between"><h2>가족 유튜브 보기</h2>${addBtn('video')}</div>${addForm('video')}
    ${vl.length ? `<div class="vtl">${groups.map((g) => `<div class="vtl-g"><div class="vtl-d">${dlabel(g.d)}</div><div class="vids">${g.l.map(vcard).join('')}</div></div>`).join('')}</div>`
      : '<div class="empty">아직 올린 영상이 없어요.</div>'}</section>`;

  $('#main').innerHTML = video + sched + bucket + tripHtml() + festHtml();
  mountMap();
  // 병원 일정: 다가오는 일정이 없으면 맨 밑에 작게 접어 두고, 있으면 펼쳐서 달력으로도 보여 줌
  const hUp = of('health').filter((i) => i.date && i.date >= today()).sort(byDate);
  const box = $('#healthBox');
  box.classList.toggle('has', hUp.length > 0);
  if (!open.healthTouched) box.open = hUp.length > 0;
  box.querySelector('summary').textContent = hUp.length ? `병원 일정 · 다가오는 ${hUp.length}개` : '병원 일정';
  if (!open.calUser) open.cal = (hUp[0]?.date || today()).slice(0, 7); // 직접 넘기기 전엔 다음 진료가 있는 달
  $('#health').innerHTML = `<div class="row between" style="margin-top:4px"><span class="sub">진료 일정과 약, 검사 결과를 적어 두는 곳</span>${addBtn('health')}</div>${addForm('health')}${hUp.length ? calHtml(of('health'), open.cal) : ''}${datedList('health', '다가오는 진료가 없어요.')}`;
}

// ── 이벤트
document.addEventListener('click', async (e) => {
  const t = e.target.closest('button'); if (!t) return;
  const d = t.dataset;
  if (d.rg != null && t.tagName === 'BUTTON') { open.sel = d.rg; open.spot = ''; open.page = open.spage = 1; render(); }
  else if (d.ttab) { open.ttab = d.ttab; render(); }
  else if (d.stype) { open.stype = d.stype; open.spage = 1; render(); }
  else if (d.pg) { const [k, n] = d.pg.split('|'); open[k] = Number(n); render(); }
  else if (d.spoti) { const x = kmap.s[Number(d.spoti)]; open.spot = x.n; open.sel = x.c; render(); KMap.focus(x.c); }
  else if (d.ftab) { open.ftab = d.ftab; open.fmore = false; render(); }
  else if ('fmore' in d) { open.fmore = true; render(); }
  else if (d.pre) { open.form = 'trip'; open.edit = null; open.pre = { region: open.sel, title: d.pre, spot: d.prespot ? d.pre : '' }; render(); $('form[data-sec="trip"] input[name="date"]')?.focus(); }
  else if (d.add) { open.pre = null; open.form = d.add; open.edit = null; if (d.add === 'health') $('#healthBox').open = true; render(); document.querySelector(`form[data-sec="${d.add}"] input`)?.focus(); }
  else if ('cancel' in d) { open.form = null; open.edit = null; render(); }
  else if (d.edit) { open.edit = d.edit; open.form = null; render(); }
  else if (d.del) { open.del = d.del; render(); }
  else if ('delno' in d) { open.del = null; render(); }
  else if (d.delok) {
    t.disabled = true;
    try { await api('POST', { op: 'del', id: d.delok }); items = items.filter((i) => i.id !== d.delok); open.del = null; render(); toast('지웠어요'); }
    catch { toast('지우지 못했어요'); t.disabled = false; }
  }
  else if (d.tick) {
    const it = items.find((i) => i.id === d.tick); if (!it) return;
    const prev = { done: it.done, doneOn: it.doneOn };
    it.done = !it.done; if (it.done) it.doneOn = today(); else delete it.doneOn; render();
    try { await api('POST', { op: 'save', item: it }); toast(it.done ? '이뤘어요! 🎉' : '체크를 풀었어요'); }
    catch { Object.assign(it, prev); if (!prev.doneOn) delete it.doneOn; render(); toast('저장하지 못했어요'); }
  }
  else if ('past' in d) { open.past = !open.past; render(); }
  else if (d.cal) { open.calUser = true; const [y, m] = open.cal.split('-').map(Number), n = new Date(y, m - 1 + Number(d.cal), 1); open.cal = `${n.getFullYear()}-${String(n.getMonth() + 1).padStart(2, '0')}`; render(); }
  else if (d.play) {
    const box = t.parentElement;
    box.innerHTML = `<iframe src="https://www.youtube-nocookie.com/embed/${encodeURIComponent(d.play)}?autoplay=1&rel=0&playsinline=1" title="영상" referrerpolicy="strict-origin-when-cross-origin" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen></iframe>`;
  }
  else if (t.id === 'copyLink') {
    const url = `${location.origin}${location.pathname}?k=${shareKey}`;
    try { await navigator.clipboard.writeText(url); toast('가족 공유 주소를 복사했어요'); }
    catch { prompt('주소를 복사하세요', url); }
  }
  else if (t.id === 'newKey') {
    if (t.dataset.sure !== '1') { t.dataset.sure = '1'; t.textContent = '예전 주소는 막혀요. 바꿀까요?'; t.classList.add('warn'); return; }
    try { shareKey = (await api('POST', { op: 'newKey' })).key; toast('새 주소로 바꿨어요. 다시 복사해 보내 주세요'); }
    catch { toast('바꾸지 못했어요'); }
    t.dataset.sure = ''; t.textContent = '주소 바꾸기'; t.classList.remove('warn');
  }
});

document.addEventListener('submit', async (e) => {
  const f = e.target;
  if (f.id === 'gateForm') {
    e.preventDefault();
    adminKey = $('#gateKey').value.trim();
    try { localStorage.setItem('ai-admin-key', adminKey); } catch {}
    return load();
  }
  if (!f.matches('form.form')) return;
  e.preventDefault();
  const item = Object.fromEntries(new FormData(f));
  delete item.q;
  item.sec = f.dataset.sec;
  const old = items.find((i) => i.id === f.dataset.id);
  if (old) Object.assign(item, { id: old.id, at: old.at, done: old.done });
  if (item.sec === 'bucket') item.done = !!item.doneOn || (!!old?.done && !old?.doneOn);
  if (item.sec === 'video' ? !item.url.trim() : item.sec !== 'trip' && !item.title.trim()) { toast(item.sec === 'video' ? '유튜브 주소를 넣어 주세요' : '내용을 적어 주세요'); return; }
  const btn = f.querySelector('button.main'); btn.disabled = true;
  try {
    const { item: saved } = await api('POST', { op: 'save', item });
    items = items.filter((i) => i.id !== saved.id).concat(saved);
    open.form = null; open.edit = null; open.pre = null; render(); toast(old ? '고쳤어요' : '추가했어요');
  } catch (err) {
    btn.disabled = false;
    toast(err.code === 'url' ? '유튜브 주소를 알아보지 못했어요' : '저장하지 못했어요');
  }
});

$('#healthBox summary').addEventListener('click', () => { open.healthTouched = true; });

// 여행 입력 칸: 시·도를 바꾸면 시·군·구 목록, 시·군·구를 바꾸면 명소 목록을 다시 채움. 장소 찾기로 한 번에 고르기
function refillTrip(f, region, spot) {
  const pre = { ...Object.fromEntries(new FormData(f)), region, spot };
  f.querySelector('[data-find]').closest('label').insertAdjacentHTML('beforebegin', '<i data-mark></i>');
  f.querySelectorAll('[data-find], [data-prov], select[name="region"], select[name="spot"]').forEach((el) => el.closest('label').remove());
  f.querySelector('[data-mark]').outerHTML = regionFields(pre);
}
document.addEventListener('change', (e) => {
  const f = e.target.closest('form[data-sec="trip"]'); if (!f) return;
  if (e.target.matches('[data-prov]')) { const r = kmap.r.filter((x) => x.p === e.target.value).sort((a, b) => a.n.localeCompare(b.n, 'ko'))[0]; refillTrip(f, r.c, ''); }
  else if (e.target.name === 'region') refillTrip(f, e.target.value, '');
  else if (e.target.name === 'spot' && e.target.value && !f.elements.title.value.trim()) f.elements.title.value = e.target.value;
});
document.addEventListener('input', (e) => {
  if (!e.target.matches('[data-find]')) return;
  const v = e.target.value.trim(), f = e.target.form;
  const s = kmap.s.find((x) => `${x.n} (${KMap.full(x.c)})` === v || x.n === v), r = kmap.r.find((x) => KMap.full(x.c) === v);
  if (!s && !r) return;
  const title = f.elements.title.value;
  refillTrip(f, s ? s.c : r.c, s ? s.n : '');
  if (s && !title.trim()) f.elements.title.value = s.n;
  f.querySelector('input[name="date"]')?.focus();
});
fetch('/programs/mom/kmap.json').then((r) => r.json()).then((j) => { kmap = j; KMap.use(j); if (!$('#app').hidden) render(); }).catch(() => {});

if (!viewKey && !adminKey) { $('#gate').hidden = false; } else load();
</script>
</body>
</html>
