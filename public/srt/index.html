<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>자막 파일 받기</title>
<style>
:root { --bg: #f6f5f2; --ink: #1d1d1f; --muted: #6b6b70; --line: #ddd9d0; --panel: #fff; --acc: #1d1d1f; }
@media (prefers-color-scheme: dark) { :root { --bg: #141416; --ink: #ececee; --muted: #9a9aa2; --line: #2e2e33; --panel: #1c1c20; --acc: #ececee; } }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.6 system-ui, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; }
main { max-width: 560px; margin: 0 auto; padding: 28px 16px; display: grid; gap: 14px; }
h1 { font-size: 20px; margin: 0; }
p { margin: 0; color: var(--muted); }
button { font: inherit; border: 0; border-radius: 10px; padding: 10px 16px; background: var(--acc); color: var(--bg); cursor: pointer; justify-self: start; }
.row { display: flex; flex-wrap: wrap; gap: 8px; }
.ghost { background: transparent; color: var(--ink); border: 1px solid var(--line); }
.note { font-size: 13px; }
pre { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px; margin: 0; max-height: 50vh; overflow: auto; white-space: pre-wrap; font: 13px/1.5 ui-monospace, Menlo, Consolas, monospace; }
</style>
</head>
<body>
<main>
  <h1>🎬 자막 파일 받기</h1>
  <p id="msg">SNS 통합 관리에서 만든 자막을 .srt 파일로 저장해요. 캡컷에서 텍스트 → 자막 가져오기로 넣으면 돼요.</p>
  <div class="row" id="folderRow" hidden>
    <button type="button" id="saveDir">📁 폴더에 저장</button>
    <button type="button" class="ghost" id="pickDir">저장 폴더 고르기</button>
    <button type="button" class="ghost" id="saveAs">다른 곳에 저장…</button>
  </div>
  <p class="note" id="dirNote" hidden></p>
  <button type="button" id="dl" hidden>다시 받기</button>
  <pre id="out" hidden></pre>
</main>
<script>
// 주소 # 뒤에 담긴 자막을 받아 .srt로 저장 (서버로는 아무것도 보내지 않아요)
// PC 크롬·엣지: 저장 폴더를 한 번 고르면 이 기기에 기억해 두고 다음부터 그 폴더에 바로 저장해요
(function () {
  const $ = (id) => document.getElementById(id);
  const h = new URLSearchParams(location.hash.slice(1));
  const d = h.get("d"), msg = $("msg");
  if (!d) { msg.textContent = "받을 자막이 없어요. SNS 통합 관리의 카드 창에서 '🎬 자막 파일' 버튼으로 열어 주세요."; return; }
  let text;
  try {
    const b = atob(d.replace(/ /g, "+").replace(/-/g, "+").replace(/_/g, "/"));
    text = new TextDecoder().decode(Uint8Array.from(b, (c) => c.charCodeAt(0)));
  } catch (e) { msg.textContent = "자막을 읽지 못했어요. 다시 만들어 주세요."; return; }
  const name = (h.get("n") || "자막").replace(/[\\/:*?"<>|]/g, "").trim().slice(0, 60) + ".srt";
  const blob = () => new Blob(["\uFEFF" + text], { type: "application/x-subrip" });
  $("out").textContent = text; $("out").hidden = false;

  // 일반 다운로드 (폴더 고르기를 못 쓰는 브라우저: 폰, 사파리 등)
  const download = () => {
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob()); a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
  };

  // 저장 폴더 기억 (IndexedDB, 이 기기·이 브라우저에만)
  const db = () => new Promise((ok, no) => { const r = indexedDB.open("srt-save", 1); r.onupgradeneeded = () => r.result.createObjectStore("kv"); r.onsuccess = () => ok(r.result); r.onerror = () => no(r.error); });
  const kv = async (mode, fn) => { const x = await db(); return new Promise((ok, no) => { const t = x.transaction("kv", mode), q = fn(t.objectStore("kv")); t.oncomplete = () => ok(q && q.result); t.onerror = () => no(t.error); }); };
  const getDir = () => kv("readonly", (s) => s.get("dir")).catch(() => null);
  const setDir = (v) => kv("readwrite", (s) => s.put(v, "dir")).catch(() => {});

  const can = "showDirectoryPicker" in window;
  if (!can) {
    msg.textContent = `'${name}' 파일을 받았어요. 이 브라우저는 폴더 고르기를 지원하지 않아서 기본 다운로드 폴더에 저장돼요. 안 받아졌으면 '다시 받기'를 눌러 주세요.`;
    $("dl").hidden = false; $("dl").onclick = download; download(); return;
  }

  let dir = null;
  const showDir = () => {
    $("folderRow").hidden = false;
    $("saveDir").textContent = dir ? `📁 '${dir.name}' 폴더에 저장` : "📁 저장 폴더 고르고 저장";
    $("pickDir").hidden = !dir;
    $("dirNote").hidden = false;
    $("dirNote").textContent = dir ? "다음부터도 이 폴더에 저장해요. 바꾸려면 '저장 폴더 고르기'를 누르세요." : "폴더를 한 번 고르면 이 컴퓨터에서는 다음부터 그 폴더에 바로 저장해요.";
  };
  const writeTo = async (folder) => {
    let n = name, i = 1;
    // 같은 이름이 있으면 '이름 (2).srt'로
    while (true) { try { await folder.getFileHandle(n); n = name.replace(/\.srt$/, ` (${++i}).srt`); } catch { break; } }
    const f = await folder.getFileHandle(n, { create: true }), w = await f.createWritable();
    await w.write(blob()); await w.close();
    msg.textContent = `'${folder.name}' 폴더에 '${n}'로 저장했어요.`;
  };
  const pick = async () => {
    try { dir = await window.showDirectoryPicker({ id: "srt", mode: "readwrite", startIn: dir || "downloads" }); await setDir(dir); showDir(); return true; }
    catch (e) { if (e && e.name !== "AbortError") msg.textContent = "폴더를 열지 못했어요. 다시 골라 주세요."; return false; }
  };
  const saveDir = async () => {
    try {
      if (!dir && !(await pick())) return;
      if ((await dir.queryPermission({ mode: "readwrite" })) !== "granted" && (await dir.requestPermission({ mode: "readwrite" })) !== "granted") { msg.textContent = "폴더에 저장할 권한을 허락해 주세요."; return; }
      await writeTo(dir);
    } catch (e) { msg.textContent = "저장하지 못했어요. 폴더를 다시 골라 주세요."; dir = null; showDir(); }
  };
  $("saveDir").onclick = saveDir;
  $("pickDir").onclick = async () => { if (await pick()) saveDir(); };
  $("saveAs").onclick = async () => {
    try {
      const f = await window.showSaveFilePicker({ id: "srt", suggestedName: name, startIn: dir || "downloads", types: [{ description: "자막 파일", accept: { "application/x-subrip": [".srt"] } }] });
      const w = await f.createWritable(); await w.write(blob()); await w.close();
      msg.textContent = `'${f.name}'로 저장했어요.`;
    } catch (e) { if (e && e.name !== "AbortError") msg.textContent = "저장하지 못했어요."; }
  };

  (async () => {
    dir = await getDir(); showDir();
    // 이미 허락된 폴더면 열자마자 바로 저장
    if (dir) {
      try { if ((await dir.queryPermission({ mode: "readwrite" })) === "granted") { await writeTo(dir); return; } } catch { dir = null; showDir(); return; }
      msg.textContent = `'${name}' 저장 준비가 됐어요. 아래 버튼을 누르면 '${dir.name}' 폴더에 저장해요.`;
    } else msg.textContent = `'${name}'을 어디에 저장할지 골라 주세요.`;
  })();
})();
</script>
</body>
</html>
